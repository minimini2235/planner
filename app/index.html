/* ---------- month ⇄ week: the week row unfolds (calendar and weekly goals together) ---------- */
const rowsFor = (n, wi) => Array.from({length:n}, (_,i) => i===wi ? '1fr' : '0fr').join(' ');
function setFold(wi, on){
  const cal = app.querySelector('.month .cal'), wk = app.querySelector('.month .wkbox');
  cal.querySelectorAll('.cell').forEach((c,i) => c.classList.toggle('fold', on && Math.floor(i/7)!==wi));
  wk?.querySelectorAll('.wrow').forEach((r,i) => r.classList.toggle('fold', on && i!==wi));
  cal.classList.toggle('unfold', on); wk?.classList.toggle('unfold', on);
}
function fillWeekRow(wi){ // the opened week shows exactly what the week page will show
  monthGrid(st.y, st.m)[wi].forEach(d => { const b = app.querySelector(`.month .cb[data-iso="${iso(d)}"]`); if (b) b.innerHTML = dayList(iso(d)); });
  const wh = app.querySelector('.month .wh'); if (wh) wh.innerHTML = `${foldBtn}<span>WEEK ${wi+1}</span>`;
}
function flyNums(wi){ // the week's dates travel between their cells and the Mon/Tue row, keeping their column
  const row = monthGrid(st.y, st.m)[wi], spans = [...app.querySelectorAll('.month .dow .dw')];
  return row.map((d,i) => {
    const k = iso(d), el = document.createElement('i');
    el.className = 'dn' + (k===TODAY?' td':'') + (d.getMonth()!==st.m?' out':''); el.textContent = d.getDate(); spans[i].appendChild(el);
    return {el, src: d.getMonth()===st.m ? app.querySelector(`.month .cell[data-iso="${k}"] .d`) : null};
  });
}
function unfoldTo(wk, sel){
  // tall screens show one day at a time, so the 7-day row unfolding first would flash the wide-screen week — just fade in
  if (st.view!=='month' || st.hal || reduced || st.busy || S.set.sum===2 || st.portrait) return false;
  const g = monthGrid(st.y, st.m), wi = g.findIndex(w => iso(w[0])===iso(wk));
  const cal = app.querySelector('.month .cal'), box = app.querySelector('.month .wkbox');
  if (wi<0 || !cal) return false;
  st.busy = true; moveKnob(2, {w:`week ${wi+1}`});
  const nums = flyNums(wi);
  nums.forEach(({el, src}) => { if (src){ const a = src.getBoundingClientRect(), b = el.getBoundingClientRect();
    el.style.transform = `translate(${a.left-b.left}px,${a.top-b.top}px)`; src.style.visibility = 'hidden'; } else el.style.opacity = '0'; });
  fillWeekRow(wi); setFold(wi, true);
  void cal.offsetHeight;
  cal.style.gridTemplateRows = rowsFor(g.length, wi); if (box) box.style.gridTemplateRows = rowsFor(g.length, wi);
  nums.forEach(({el}) => { el.style.transition = `transform .5s ${EASE}, opacity .3s ease`; el.style.transform = ''; el.style.opacity = ''; });
  setTimeout(() => { st.busy = false; st.wk = wk; st.sel = sel; st.view = 'week'; st.anim = 'in'; render(); }, 520);
  return true;
}
function foldBack(){
  if (reduced) return;
  const g = monthGrid(st.y, st.m), wi = g.findIndex(w => iso(w[0])===iso(st.wk));
  const cal = app.querySelector('.month .cal'), box = app.querySelector('.month .wkbox');
  if (wi<0 || !cal) return;
  st.busy = true;
  const all = Array(g.length).fill('1fr').join(' '), els = [cal, box, ...app.querySelectorAll('.month .cell,.month .wrow,.month .cb')].filter(Boolean);
  const nums = flyNums(wi), ends = nums.map(({el, src}) => { if (!src) return null;
    const a = src.getBoundingClientRect(), b = el.getBoundingClientRect(); src.style.visibility = 'hidden'; return `translate(${a.left-b.left}px,${a.top-b.top}px)`; });
  els.forEach(el => el.style.transition = 'none');
  fillWeekRow(wi); setFold(wi, true);
  cal.style.gridTemplateRows = rowsFor(g.length, wi); if (box) box.style.gridTemplateRows = rowsFor(g.length, wi);
  void cal.offsetHeight;
  els.forEach(el => el.style.transition = '');
  requestAnimationFrame(() => requestAnimationFrame(() => {
    setFold(wi, false);
    cal.style.gridTemplateRows = all; if (box) box.style.gridTemplateRows = all;
    nums.forEach(({el}, i) => { el.style.transition = `transform .5s ${EASE}, opacity .25s ease`; if (ends[i]) el.style.transform = ends[i]; else el.style.opacity = '0'; });
    setTimeout(() => { st.busy = false; nums.forEach(({el, src}) => { el.remove(); if (src) src.style.visibility = ''; });
      if (st.view==='month' && !st.hal){ const wh = app.querySelector('.month .wh'); if (wh) wh.innerHTML = '<span>WEEKLY</span>';
        app.querySelectorAll('.month .cell.out .cb').forEach(b => b.innerHTML = ''); fitCells(); } }, 540);
  }));
}
function moveKnob(i, txt){ const k = app.querySelector('.knob'); if (k) k.style.transform = `translateX(${i*100}%)`;
  app.querySelectorAll('.pill button').forEach((b,j) => b.classList.toggle('on', j===i)); st.knob = i; animTitle(i, txt); }
// slide the title's month / week parts open or shut (txt: new words for them, when they change too)
function animTitle(i, txt={}){
  const t = app.querySelector('.ptl'); if (!t) return;
  const seg = c => t.querySelector('.ts.'+c);
  if (txt.m) seg('m').querySelector('.tv').textContent = txt.m;
  if (txt.w) seg('w').querySelector('.tv').textContent = txt.w;
  ['m','w'].forEach(c => { const s = seg(c); s.style.maxWidth = (s.classList.contains('off') ? 0 : s.scrollWidth) + 'px'; });
  void t.offsetWidth;
  ['m','w'].forEach((c,j) => { const s = seg(c), on = j+1 <= i; s.classList.toggle('off', !on); s.style.maxWidth = (on ? s.scrollWidth : 0) + 'px'; });
}

/* ---------- navigation ---------- */
function setYM(y,m){ // keep the week number when the month or year changes
  const wi = weekIndex(), d = new Date(y,m,1);
  st.y = d.getFullYear(); st.m = d.getMonth();
  const g = monthGrid(st.y, st.m); st.wk = g[Math.min(wi, g.length-1)][0];
}
function shiftWeek(dir){
  const nm = addDays(st.wk, 7*dir), sun = addDays(nm, 6), inM = x => x.getFullYear()===st.y && x.getMonth()===st.m;
  if (!inM(nm) && !inM(sun)){ const ref = dir>0 ? nm : sun; st.y = ref.getFullYear(); st.m = ref.getMonth(); }
  st.wk = nm;
}
function step(dir){
  if (st.view==='year') setYM(st.y+dir, st.m); else if (st.view==='month') setYM(st.y, st.m+dir); else shiftWeek(dir);
}
function toggleRef(ref){
  const [coll, key, id] = ref.split('|');
  if (coll==='rt' || coll==='ss'){ const o = coll==='rt' ? S.rdone : S.sdone, k = `${key}|${id}`; if (o[k]) delete o[k]; else o[k] = true; }
  else if (coll==='ms'){ const m = msById(id); if (m) m.done = !m.done; }
  else { const it = L(coll,key).find(x => x.id===id); if (it) it.done = !it.done; }
  save(); refreshBehind();
}
function goWeek(mon, sel){
  const w = pIso(mon); sel ??= iso(w)===iso(mondayOf(today)) ? dowOf(today) : 0;
  if (unfoldTo(w, sel)) return;
  st.wk = w; st.sel = sel; st.view = 'week'; st.anim = 'in'; render();
}

/* ---------- "□ +": the one way to make something, everywhere ----------
   version 1 → the row sheet. version 3 → one small bar (like a search box) that does it all:
   tap the mark to switch kind, type, pick 할일 · 세부 (or days) in the strip on the right, Enter, next. */
const PLUS = (t, title='추가') => `<button class="wadd" data-act="plus" data-t="${t}" aria-label="${title}">${mark('td',false,'ghost def')}<span>+</span></button>`;
const QLABEL = {todo:'할일', event:'일정', routine:'루틴', ms:'이정표', gen:'일반'};
const QPH = {todo:'+ 할일', event:'+ 일정', routine:'+ 루틴'};
function openPlus(t, el){
  const [coll, key, x] = t.split('|');
  if (S.set.ver!==3){
    if (coll==='days') newPlan(key);
    else if (coll==='weeks'){ st.ed = {mode:'wk', type:'todo', key, text:'', cat:null, sub:null, dows:[]}; render(); }
    else if (coll==='pc') newHal(st.htype, {sub:key || (st.hsub!=='all' ? st.hsub : null), cat:(key && subById(key)?.cat) || (st.hcat!=='all' ? st.hcat : null), date: x.length===7 ? monthDue(x) : x});
    else newHal(st.htype, {place:'stack'});
    return;
  }
  const r = el.getBoundingClientRect();
  const sub = coll==='pc' ? (key || (st.hsub!=='all' ? st.hsub : null)) : coll==='stack' ? (x || null) : null;
  const cat = sub ? subById(sub).cat : coll==='stack' ? (key || null) : coll==='days' ? st.qcat : null;
  const day = coll==='days' ? key : coll==='pc' ? (x.length===7 ? monthDue(x) : x) : '';
  st.qp = {t, type: coll==='days' ? st.qtype : coll==='weeks' ? 'todo' : st.htype, cat, sub: coll==='days' ? st.qsub : sub,
    lock: coll==='pc' && !!sub, dows: coll==='days' ? [0,1,2,3,4,5,6] : [0,2,4], x:r.left, y:r.bottom, top:r.top, n:0,
    start: coll==='days' ? key : coll==='pc' ? day : '', end: coll==='pc' ? day : '', noEnd: coll==='days', date:''};   // a 루틴 made on a day starts on that day
  drawQp(true);
}
function qpWhere(){
  const [coll, key, x] = st.qp.t.split('|');
  if (coll==='days' || (coll==='pc' && x.length===10)){ const d = pIso(coll==='days' ? key : x); return `${d.getMonth()+1}/${d.getDate()} ${DOW_K[dowOf(d)]}`; }
  if (coll==='pc') return `${+x.slice(5)}월`;
  if (coll==='weeks') return `week ${monthGrid(st.y, st.m).findIndex(w => iso(w[0])===key)+1 || ''}`.trim();
  return '보관함';
}
function qpHTML(){
  const q = st.qp; if (!q) return '';
  const coll = q.t.split('|')[0], kinds = q.edit ? null : kindsOf(coll);
  const kindMark = q.type==='event' ? 'ev' : q.type==='routine' || q.type==='ms' ? 'rt' : 'td';
  const lab = q.type==='ms' ? '루틴' : QLABEL[q.type];
  const head = q.edit ? `<span class="qpm still">${mark('rt',false,'ghost def')}<span>루틴</span></span>` : kinds ? `<button class="qpm" data-q="kind" title="눌러서 종류 바꾸기">${mark(kindMark,false,'ghost def')}<span>${lab}</span></button>`
    : `<span class="qpm still">${mark('td',false,'ghost def')}<span>목표</span></span>`;
  const dw = () => DOW_K.map((d,i) => `<button class="qd${q.dows.includes(i)?' on':''}" data-q="dw" data-i="${i}">${d}</button>`).join('');
  const cs = () => q.cat ? `<button class="qc back" data-q="cat" data-c="${q.cat}">${esc(catById(q.cat)?.emoji||'')} ${esc(catById(q.cat)?.name||'')} ✕</button>` +
      subsOf(q.cat).map(s => `<button class="qc${q.sub===s.id?' on':''}" data-q="sub" data-s="${s.id}">${esc(s.name)}</button>`).join('')
    : userCats().map(c => `<button class="qc" data-q="cat" data-c="${c.id}">${c.emoji?esc(c.emoji)+' ':''}${esc(c.name)}</button>`).join('');
  const span = q.type==='routine' || q.type==='ms', dated = coll!=='weeks' && coll!=='stack';
  q.calOne = !span;
  q.needEnd = false;   // a 할일 루틴 can run without an end, like any routine
  // same pieces, same order, on every page: ★ (할일) · day or 언제부터–언제까지 · days of the week · 할일 (planner only)
  let strip = '';
  if (q.type==='todo' && coll!=='weeks') strip += `<button class="qc star${q.star?' on':''}" data-q="star" title="중요한 할일 · 주간목표에도 나와요">★ 이정표</button>`;
  if (dated && !span) strip += `<button class="qc cal${q.cal?' on':''}" data-q="cal" title="날짜">${CAL_ICON}${md(q.date || q.end || q.t.split('|')[1])}</button>`;
  if (dated && span) strip += `<button class="qc cal${q.cal?' on':''}" data-q="cal" title="언제부터 – 언제까지">${CAL_ICON}${q.start?md(q.start):'오늘'} – ${q.noEnd ? '계속' : q.end ? md(q.end) : '?'}</button>`;
  if (span) strip += dw();
  if (!q.lock && coll!=='weeks') strip += userCats().map(c => `<button class="qc${q.cat===c.id?' on':''}" data-q="cat" data-c="${c.id}">${c.emoji?esc(c.emoji)+' ':''}${esc(c.name)}</button>`).join('');
  const subs = !q.lock && q.cat ? subsOf(q.cat) : [];
  const under = `<div class="qunder">${subs.length ? `<div class="qsubs${q.ask?' need':''}">${subs.map(s => `<button class="qc${q.sub===s.id?' on':''}" data-q="sub" data-s="${s.id}">${esc(s.name)}</button>`).join('')}</div>` : '<span></span>'}
    <div class="qact"><button data-q="cancel">취소</button><button class="ok" data-q="done">완료</button></div></div>`;
  const ask = q.ask ? `<div class="qask">${coll==='stack' ? '보관함에는 세부할일을 골라야 넣을 수 있어요' : `세부할일 없이 “${esc(catById(q.cat)?.name||'')}”로 저장할까요?`}<button data-q="pick">세부 고르기</button>${coll==='stack' ? '' : '<button class="ok" data-q="anyway">이대로 저장</button>'}</div>` : '';
  const w = Math.min(480, innerWidth - 16), left = Math.max(8, Math.min(q.x - 12, innerWidth - w - 8));
  const below = q.y + 60 < innerHeight;
  const pos = st.portrait ? '' : `left:${left}px;width:${w}px;${below ? `top:${q.y + 4}px` : `top:${q.top - 52}px`}`;
  const ph = q.apply ? '루틴 · 언제까지 할지 달력에서 고르세요' : q.edit ? '루틴 이름' : `${qpWhere()} · ${lab}${q.n?` (${q.n}개 추가됨)`:''}`;
  return `<div class="qpop${st.portrait?' bottom':''}" id="qpop" style="${pos}">${ask}${head}<input id="qin" placeholder="${ph}" autocomplete="off" enterkeyhint="done" aria-label="내용">${strip?`<div class="qps">${strip}</div>`:''}${under}${q.cal ? qcalHTML(q) : ''}</div>`;
}
function drawQp(focus){
  const old = app.querySelector('#qpop'), val = old?.querySelector('#qin')?.value || '';
  const tmp = document.createElement('div'); tmp.innerHTML = qpHTML(); const n = tmp.firstElementChild;
  if (old && n) old.replaceWith(n); else if (n) app.appendChild(n); else old?.remove();
  const inp = app.querySelector('#qin'); if (inp){ inp.value = val; if (focus || document.activeElement===document.body) inp.focus(); }
  placeCal();
}
function closeQp(){ st.qp = null; app.querySelector('#qpop')?.remove(); }
function qpAct(b){
  const q = st.qp, d = b.dataset;
  // applying a 루틴 from the 보관함: once the stretch is picked, the calendar's 완료 finishes the job
  if (d.q==='calok' && q.apply && q.start && q.end && app.querySelector('#qin').value.trim()){ q.cal = false; q.closeAfter = true; qpAdd(); return; }
  if (calAct(q, d)){ drawQp(true); return; }
  if (d.q==='star') q.star = !q.star;
  else if (d.q==='kind'){ const coll = q.t.split('|')[0], order = kindsOf(coll);
    q.type = order[(order.indexOf(q.type)+1) % order.length]; if (coll==='days') st.qtype = q.type; else st.htype = q.type;

// asks for a moment, above the bar, when a 할일 was picked but no 세부할일 — the bar stays as it is underneath
function askSub(){ const q = st.qp; q.ask = true; drawQp(true); clearTimeout(askSub.t); askSub.t = setTimeout(() => { if (st.qp===q && q.ask){ q.ask = false; drawQp(); } }, 4500); return false; }
function qpAdd(){
  const q = st.qp, inp = app.querySelector('#qin'), text = inp.value.trim(); if (!text) return false;
  const [coll, key, x] = q.t.split('|'), dows = [...q.dows].sort();
  const noSub = q.cat && !q.sub && subsOf(q.cat).length && !q.lock;
  if (noSub && (coll==='stack' || !q.skipSub)) return askSub();
  if (coll==='days'){
    if (q.type==='routine'){
      if (!dows.length) return shake();
      if (!q.noEnd && !q.end){ q.cal = true; q.calYM = (q.start||TODAY).slice(0,7); drawQp(true); return false; }   // the stretch isn't finished yet
      applyRoutine.skipSub = !!q.skipSub;
      const bad = applyRoutine({text, dows, start:q.start || key, until:q.noEnd ? '' : (q.end || ''), cat:q.cat, sub:q.sub});
      applyRoutine.skipSub = false;
      if (bad) return shake();

    else { const o = {id:uid(), text, type:q.type, done:false}; setCS(o, q.cat, q.sub); if (q.type==='todo' && q.star) o.star = true; L('days', q.date || key).push(o); }
  } else if (coll==='weeks'){ const o = {id:uid(), text, done:false}; setCS(o, q.cat, q.sub); L('weeks', key).push(o); }
  else if (coll==='pc'){
    const sub = q.sub, due = q.date || (x.length===7 ? monthDue(x) : x);
    if (!sub) return shake();
    if (q.type==='ms'){ if (!q.end && !q.noEnd) return needEnd(q, due); const m = {id:uid(), sub, text, due:q.noEnd ? OPEN : (q.end || due), dows:dows.length ? dows : [0,2,4], done:false, created:TODAY}; const s0 = q.start || due; if (s0 <= m.due) m.start = s0; S.ms.push(m); }   // always its own start, so it never waits for the one before it
    else { const o = {id:uid(), text, type:q.type==='event' ? 'event' : 'todo', done:false}; setCS(o, subById(sub).cat, sub); if (q.type==='todo' && q.star) o.star = true; L('days', due).push(o); }
  } else { if (!q.sub) return shake(); const o = {id:uid(), text, done:false, kind:q.type}; setCS(o, q.cat, q.sub); if (q.type==='ms') o.dows = dows.length ? dows : [0,2,4]; else if (q.type==='todo' && q.star) o.star = true; L('stack','all').push(o); }
  if (q.apply){ takeItem(q.apply); save(); closeQp(); refreshBehind(); return true; }   // it came out of the 보관함
  save(); inp.value = ''; q.n++;
  refreshBehind(); drawQp(true);
  return true;
}

// one place that writes a routine — used by the bar and by the sheet. returns the id of the row to flag, or '' when done
function applyRoutine({text, dows, start, until, cat, sub, src, id}){
  dows = [...dows].sort();
  if (!dows.length) return 'rdows';
  start = start || TODAY;
  if (until && until < start) return 'rdate';
  if (cat && !sub && subsOf(cat).length && !applyRoutine.skipSub) return 'rsub';
  const stop = () => { const r = rById(id); if (!r) return; if (r.start>=TODAY) S.routines = S.routines.filter(x => x!==r); else r.end = TODAY; };
  if (sub && subById(sub)){ // 할일 루틴: also on the 할일 page; needs its 언제까지
    let m = src==='ms' ? msById(id) : null;
    if (!m){ m = {id:uid(), done:false, created:TODAY}; S.ms.push(m); if (src==='rdef' && id) stop(); }
    Object.assign(m, {text, sub, due:until || OPEN, dows, start});   // no 언제까지 → it just keeps going
    if (src==='rdef' && m.start < TODAY) m.start = TODAY;   // the old routine keeps its past
  } else { // 일반 루틴
    if (src==='ms'){ S.ms = S.ms.filter(x => x.id!==id); id = null; }
    const end = until ? isoAdd(until,1) : null, r = src==='rdef' ? rById(id) : null;
    if (r){ const same = r.dows.join()===dows.join();
      if (same || r.start>=TODAY){ Object.assign(r, {text, dows, start}); if (end) r.end = end; else delete r.end; }
      else { r.end = TODAY; const n = {id:uid(), text, dows, start:TODAY, grp: r.grp || r.id}; if (end) n.end = end; S.routines.push(n); } }   // grp: the pieces of one routine, deleted together
    else { const n = {id:uid(), text, dows, start}; if (end) n.end = end; S.routines.push(n); }
  }
  return '';
}

// a routine whose weekdays were changed lives on as pieces (old days · new days); older data has no grp, so same name + back-to-back also counts
function routinePieces(r){
  const g = r.grp || r.id, set = new Set([r]);
  S.routines.forEach(x => { if ((x.grp || x.id)===g || x.grp===r.id) set.add(x); });
  let grew = true;
  while (grew){ grew = false; S.routines.forEach(x => { if (set.has(x) || x.text!==r.text) return;
    if ([...set].some(y => (y.end && y.end===x.start) || (x.end && x.end===y.start))){ set.add(x); grew = true; } }); }
  return [...set];
}
function delOpts(e){

function takeItem(ref){ const [c,k,id] = ref.split('|'); const l = L(c,k), it = l.find(x => x.id===id); if (it) S[c][k] = l.filter(x => x!==it); return it; }
function dropOn(t, ref, x, y){
  const [dc, dk, dx] = t.dataset.drop.split('|'), [sc, sk, sid] = ref.split('|');
  const when = d => d.length===7 ? null : d;   // a month cell keeps the day of the month where it can

    const m = msById(sid); if (!m) return;

    else if (dc==='weeks'){ if (open) m.start = dk; else m.due = isoAdd(dk, m.due ? dowOf(pIso(m.due)) : 6); }

    const due = dx.length===7 ? monthDue(dx) : dx;
    if (src.kind==='ms'){ // a 루틴 needs 언제까지: the bar opens with its calendar, 취소 / 완료
      const r = t.getBoundingClientRect();
      st.qp = {t:`pc|${sub}|${dx}`, type:'ms', cat:subById(sub).cat, sub, lock:true, dows:src.dows ? [...src.dows] : [0,2,4], x:r.left, y:r.top + 24, top:r.top, n:0,

    takeItem(ref);
    if (dc==='stack'){ if (!src.sub) return; const o = {id:src.id, text:src.text, done:!!src.done, kind:src.type==='event' ? 'event' : 'todo'}; setCS(o, src.cat, src.sub); if (src.star) o.star = true; L('stack','all').push(o); }
    else { const o = {...src}; if (dk) setCS(o, subById(dk).cat, dk); L('days', dx.length===7 ? sameDayIn(dx, sk) : dx).push(o); }
    save(); refreshBehind(); return;
  }
  if (dc!=='days' && dc!=='weeks') return;
  if (sc==='days' && dc==='weeks' && src.star){ takeItem(ref); L('days', isoAdd(dk, dowOf(pIso(sk)))).push(src); save(); refreshBehind(); return; } // an 이정표 dropped on another week keeps its weekday
  const hit = document.elementFromPoint(x, y)?.closest('.it[data-ref]')?.dataset.ref; let before = null;

  save(); refreshBehind();
}

  if (!tStart) return; const t = e.changedTouches[0], dx = t.clientX - tStart.x, dy = t.clientY - tStart.y, el = tStart.el; tStart = null;
  if (drag || Date.now() - noClick < 400 || el.closest?.('input, .qbar')) return;
  const vert = Math.abs(dy) > 50 && Math.abs(dy) > Math.abs(dx)*1.3, horiz = Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)*1.3;
  if ((st.view==='month' || st.view==='year') && el.closest?.('main') && vert) stepPage(dy<0 ? 1 : -1, 'y');
  else if (st.view==='month' && horiz && el.closest?.('main')){ const v = dx<0 ? 'goal' : 'cal'; if (v!==st.pm){ st.pm = v; setPm(); } }
  else if (st.view==='week' && el.closest?.('.board') && horiz) stepPage(dx<0 ? 1 : -1, 'x');
});
let wheelAcc = 0, wheelLock = 0;
addEventListener('wheel', e => {
  if (!st.portrait || st.ed || st.setOpen || st.hal || !(st.view==='month' || st.view==='year') || !e.target.closest?.('main.pager')) return;
  e.preventDefault(); if (Date.now() < wheelLock) return;
  wheelAcc += e.deltaY; if (Math.abs(wheelAcc) > 80){ stepPage(wheelAcc>0 ? 1 : -1, 'y'); wheelAcc = 0; wheelLock = Date.now() + 450; }
}, {passive:false});

/* ---------- wide vs tall ---------- */
const isPortrait = () => innerWidth < 760 || innerWidth/innerHeight < 0.9;
addEventListener('resize', () => { const typing = document.activeElement?.tagName==='INPUT';
  if (typing && (st.ed || st.qp)) return;   // the phone keyboard shrinks the screen while typing — don't squash the page behind the sheet
  const p = isPortrait(); if (p!==st.portrait && !typing){ st.portrait = p; render(); } else layout(); });
st.portrait = isPortrait();
const h = location.hash.slice(1), hv = h.match(/(year|month|week)/);
if (hv) st.view = hv[1];
if (/hal/.test(h)) st.hal = true;
if (/goal/.test(h)) st.pm = 'goal';
const hv2 = h.match(/ver([123])/); if (hv2) S.set.ver = +hv2[1];
const hh = h.match(/hv([123])/); if (hh) S.set.hv = +hh[1]; for (const k of ['hl','hy','hm']){ const mm = h.match(new RegExp(k+'([123])')); if (mm) S.set[k] = +mm[1]; }
render();
if (/opt$/.test(h)){ st.setOpen = true; render(); }
if (/edit$/.test(h)) newPlan(TODAY);
if (/msed$/.test(h)) newHal('ms');
})();
