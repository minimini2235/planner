<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff"><link rel="manifest" href="manifest.json"><link rel="icon" href="icons/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="플래너">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>흑백 플래너</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500&family=Gowun+Batang:wght@400;700&family=Jua&display=swap">
<style>
/* Layout: header = period on the left · 연/월/주 pill in the exact centre · 할일 / today / settings on the right.
   Planner: year = 12 calendars; month = calendar (3/4) + weekly goals (1/4); week = the chosen week row unfolded.
   할일 page: 할일 chips · 세부 chips · a time table (year/month/week) + 쌓아두기 on the right. */
:root{
  color-scheme:light;
  --ink:#141414; --paper:#ffffff; --mute:#9b9b9b; --faint:#d2d2d2; --soft:#e4e4e4; --hair:#efefef; --hover:#f4f4f4; --tag:#f0f0ef; --sub:#5f5f5f; --line:#bdbdbd; --line2:#dadada;
  --lw:1px; --hl:.5px; --r:4px; --ease:cubic-bezier(.4,0,.2,1);
  --font:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--font);font-weight:300}
b,strong{font-weight:500}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
button:focus-visible{outline:1px solid var(--ink);outline-offset:2px}
#app{display:flex;flex-direction:column;height:100%;min-height:520px;
  padding-block:8px 18px;padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px))}
#app.portrait{padding-block:6px 0;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
body.dnd{user-select:none;-webkit-user-select:none}

/* ---------- header ---------- */
header{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;border-bottom:var(--lw) solid var(--line);padding-bottom:6px;margin-bottom:12px;flex:none}
.hl{display:flex;align-items:center;gap:1px;min-width:0}
.ptl{font-size:18px;font-weight:400;line-height:1;letter-spacing:.01em;font-variant-numeric:tabular-nums;white-space:nowrap;padding:0 4px;overflow:hidden;text-overflow:ellipsis}
.ptl .dim{color:#a6a6a6;margin:0 .25em}
.ptl small{font-size:11px;color:var(--mute);margin-left:7px}
.arr{flex:none;width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:var(--r)}
.arr:hover{background:var(--hover)}
.arr svg{width:5px;height:7px;fill:#8f8f8f}
.arr:hover svg{fill:var(--ink)}
.pill{position:relative;display:grid;grid-template-columns:repeat(3,46px);height:30px;padding:3px;border-radius:999px;background:#f0f0f0}
.pill button{position:relative;z-index:1;border-radius:999px;font-size:12.5px;color:#777;transition:color .25s}
.pill button.on{color:var(--paper)}
.pill .knob{position:absolute;left:3px;top:3px;width:46px;height:24px;border-radius:999px;background:var(--ink);transition:transform .34s var(--ease)}
.hr{display:flex;justify-content:flex-end;align-items:center;gap:4px}
.ib{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:8px}
.ib:hover{background:var(--hover)}
.ib svg{width:19px;height:19px}
.ib.on{background:var(--ink)}
.ib.on svg *{stroke:var(--paper)}
.ib.on svg text{fill:var(--paper)}
.portrait .ptl{font-size:15px}
.portrait .pill{grid-template-columns:repeat(3,40px)}
.portrait .pill .knob{width:40px}
.portrait .hl .arr{display:none}
.portrait .ib{width:26px}
main{flex:1;min-height:0;position:relative}
.portrait main{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:24px}
.portrait main.pager{overflow:hidden;touch-action:none;padding-bottom:0}
#pg{height:100%}
.portrait #pg{height:auto}
.portrait main.pager #pg{height:100%}
.fadein{animation:fadein .3s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}

/* ---------- rows & markers ---------- */
.it{display:flex;align-items:flex-start;gap:.45em;font-size:12px;line-height:1.35;padding:1px 0;min-width:0}
.it[data-drag]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.it .tx{flex:1;min-width:0;word-break:break-all;cursor:pointer}
.it.done .tx{text-decoration:line-through;color:var(--mute)}
.it .tag{flex:none;font-size:.78em;line-height:1.3;color:#777;background:var(--tag);border-radius:3px;padding:0 .4em;margin-top:.12em;white-space:nowrap}
.it.rtn .tx,.it.step .tx{color:var(--sub)}
.it.rtn.done .tx,.it.step.done .tx{color:var(--mute)}
.it.msi .tx{font-weight:400}
.it .aux{flex:none;font-size:.8em;color:#bbb;letter-spacing:.05em;padding-top:.12em}
.ck{flex:none;width:.9em;height:.9em;margin-top:.225em;border:var(--lw) solid var(--ink);border-radius:.16em;display:inline-flex;align-items:center;justify-content:center;line-height:1;cursor:pointer;color:var(--ink);font-style:normal}
.ck i{font-style:normal;font-size:.72em;line-height:1}
.ck.done{background:var(--ink);color:var(--paper)}
.ck.ev{border-color:transparent}
.ck.ev i{display:block;width:.34em;height:.34em;border-radius:50%;background:currentColor}
.ck.ev.done{background:none;color:var(--ink)}
.ck.ms{border-radius:50%}
.ck.st{transform:scale(.78);border-color:#8a8a8a;border-radius:1px}
.ck.st.done{border-color:var(--ink)}
.ck.ghost{border-color:var(--faint);color:#c4c4c4}
.ck.ghost.ev{border-color:transparent}
.ck.def{cursor:inherit}
.add{display:flex;align-items:flex-start;gap:.45em;font-size:12px;line-height:1.35;padding:1px 0}
.add input{flex:1;min-width:0;border:0;outline:none;background:transparent;font-size:1em;line-height:1.35;padding:0}
.add input::placeholder{color:#bdbdbd}
.add .qt{display:flex;cursor:pointer}
.dlist{display:flex;flex-direction:column;gap:1px}
.dlist .it,.dlist .add{font-size:inherit}
/* very light dividers: 일정 · 루틴 · 할일 · 할일 (→ 세부) */
.gh{display:flex;align-items:center;gap:5px;font-size:.74em;color:#c2c2c2;line-height:1.2;margin:5px 0 2px;letter-spacing:.02em}
.gh i{flex:1;border-top:var(--hl) solid var(--hair)}
.gh.s{padding-left:.8em;color:#cdcdcd}
.dlist>.gh:first-child{margin-top:0}
.it.sum{cursor:pointer}
.it.sum .tx{color:var(--sub)}
.qchips{display:none;flex-wrap:wrap;gap:3px;padding:3px 0 2px}
.add.qa:focus-within+.qchips,.qchips:focus-within{display:flex}
.qchips button{font-size:10.5px;line-height:1.2;padding:2px 6px;border:var(--lw) solid var(--soft);border-radius:999px;color:#777;white-space:nowrap}
.qchips button.s{border-style:dashed}
.qchips button.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.wadd{display:flex;align-items:center;gap:.45em;font-size:12px;color:#bbb;padding:2px 0;line-height:1.35}
.wadd .ck{margin-top:0}
.wadd:hover{color:var(--ink)}
.drop-over{outline:1px dashed var(--ink);outline-offset:-3px}
.dragging{opacity:.3}
.ghostdrag{position:fixed;z-index:50;pointer-events:none;background:var(--paper);box-shadow:0 6px 22px rgba(0,0,0,.18);border-radius:5px;padding:3px 8px;font-size:12px;transform:translate(-50%,-120%);white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis}

/* ---------- year ---------- */
.year{height:100%}
.months{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:10px 30px;height:100%}
.mm{display:flex;flex-direction:column;min-height:0;cursor:pointer}
.mm .t{font-size:12px;height:18px;display:flex;align-items:flex-end;padding:0 0 3px 9px;flex:none}
.mm:hover .t{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--faint)}
.mface{flex:1;min-height:0;border:var(--lw) solid var(--line);border-radius:var(--r);transition:background .15s}
.mm:hover .mface{background:#f8f8f8}
.mgrid{height:100%;padding:6px 8px;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(6,1fr);align-items:center;justify-items:center;font-size:10px}
.mgrid span{display:inline-flex;align-items:center;justify-content:center;height:1.45em;min-width:1.7em;padding:0 2px;line-height:1;border-radius:2px;font-variant-numeric:tabular-nums}
.mgrid span.td{background:var(--ink);color:var(--paper)}
.portrait .months{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:8px 12px}
.portrait .mgrid{padding:3px 4px;font-size:8.5px}
.portrait .mm .t{font-size:11px;padding-left:5px}

/* ---------- month & week boards: calendar 3/4 · weekly 1/4 ---------- */
.board{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,1fr);grid-template-rows:18px minmax(0,1fr);column-gap:16px;height:100%}
.dow{grid-column:1;grid-row:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));font-size:12px;align-items:end;padding-bottom:3px;min-width:0;overflow:hidden}
.dow .dw{position:relative;text-align:center;white-space:nowrap}
.dow .dw.sel{font-weight:500}
.dn{position:absolute;left:4px;bottom:1px;display:inline-flex;align-items:center;height:12px;padding:0 2px;border-radius:2px;font-size:10px;font-style:normal;font-weight:300;line-height:1;color:#a8a8a8;pointer-events:none;font-variant-numeric:tabular-nums}
.dn.td{background:var(--ink);color:var(--paper)}
.dn.out{color:#d6d6d6}
.wh{grid-column:2;grid-row:1;font-size:12px;display:flex;align-items:flex-end;gap:7px;padding-bottom:3px;letter-spacing:.04em;min-width:0;overflow:hidden;white-space:nowrap}
.wh small{margin-left:auto;font-size:10px;color:var(--mute);letter-spacing:0}
.cal,.days{grid-column:1;grid-row:2;border:var(--lw) solid var(--line);border-radius:var(--r);overflow:hidden;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));min-height:0;min-width:0}
.cell{position:relative;border-right:var(--hl) solid var(--line2);border-bottom:var(--hl) solid var(--line2);overflow:hidden;min-height:0;min-width:0;contain:strict;cursor:pointer}
.cell:nth-child(7n){border-right:0}
.cell.last{border-bottom:0}
.cell:hover{background:#fbfbfb}
.cell .d{position:absolute;left:3px;top:3px;display:inline-flex;align-items:center;height:12px;font-size:10px;color:#a8a8a8;line-height:1;padding:0 2px;border-radius:2px;font-variant-numeric:tabular-nums;transition:opacity .3s}
.cell.today .d{background:var(--ink);color:var(--paper)}
.cell.out .d{color:#dcdcdc}
.cb{position:absolute;left:0;right:0;top:17px;bottom:0;padding:1px 5px 4px;overflow:hidden;transition:top .5s var(--ease)}
.cb .dlist{font-size:11px}
.cb .it .tx{flex:0 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb .it .tag,.cb .gh{display:none}
.wkbox{grid-column:2;grid-row:2;border:var(--lw) solid var(--line);border-radius:var(--r);overflow:hidden;display:grid;min-height:0;min-width:0}
.wrow{border-bottom:var(--hl) solid var(--line2);padding:4px 8px;overflow:hidden;min-height:0;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.wrow:last-child{border-bottom:0}
.month .wrow:hover{background:#fbfbfb}
.wrow .wl{font-size:10px;color:#a8a8a8;letter-spacing:.04em;margin-bottom:1px;transition:opacity .3s}
.wrow.now .wl{color:var(--ink)}
.wrow .it,.wrow .wadd,.wrow .add{font-size:11.5px}
.wkbox.one .wrow{cursor:default;padding:7px 9px;overflow:auto}
.wkbox.one .wrow .it,.wkbox.one .wrow .wadd,.wkbox.one .wrow .add{font-size:12px}
.dcol{border-right:var(--hl) solid var(--line2);padding:7px 5px;overflow:auto;min-width:0;cursor:copy}
.dcol:last-child{border-right:0}
.dcol .dlist{font-size:11px}
.dcol.sel{background:#fafafa}
.fbtn{display:flex;align-items:center;justify-content:center;width:12px;height:10px}
.fbtn svg{width:9px;height:7px;fill:var(--ink)}
/* month → week: the chosen week row unfolds to full height */
.cal,.wkbox{transition:grid-template-rows .5s var(--ease)}
.cell,.wrow{transition:opacity .22s ease,border-color .18s ease}
.cell.fold,.wrow.fold{opacity:0;border-color:transparent}
.unfold .cell:not(.fold),.unfold .wrow:not(.fold){border-bottom-color:transparent}
.unfold .cell:not(.fold) .d,.unfold .wrow:not(.fold) .wl{opacity:0}
.unfold .cell:not(.fold) .cb{top:6px;padding-top:1px}
.unfold .cell:not(.fold) .cb .gh{display:flex}
.unfold .cell:not(.fold) .cb .tag{display:inline}
.unfold .cell:not(.fold) .cb .it .tx{white-space:normal;flex:1}

/* tall screens */
.portrait .board{grid-template-columns:minmax(0,1fr) minmax(0,0fr);column-gap:0;height:auto;grid-template-rows:16px auto}
.portrait .dow{font-size:10px}
.portrait .dn{font-size:8.5px;left:2px}
.portrait .cell .d{font-size:9px;height:11px;left:2px;top:2px}
.portrait .cb{top:14px;padding:0 2px 1px}
.portrait .cb .dlist{font-size:8.5px}
.portrait .dcol{padding:5px 2px}
.portrait .dcol .dlist{font-size:9px}
.portrait .unfold .cell:not(.fold) .cb{top:5px}
.portrait .unfold .cell:not(.fold) .cb .dlist{font-size:9px}
.portrait .wh,.portrait .wkbox{visibility:hidden}
.portrait .board.v2{transition:grid-template-columns .45s var(--ease)}
.portrait .board.v2 .wh,.portrait .board.v2 .wkbox{visibility:visible}
.portrait .board.v2 .wkbox{width:76%;justify-self:center}
.portrait .board.v2 .wh{width:76%;justify-self:center}
.portrait .board.v2.pgoal{grid-template-columns:minmax(0,0fr) minmax(0,1fr)}
.portrait .board.v2 .wrow .it,.portrait .board.v2 .wrow .wadd,.portrait .board.v2 .wrow .add{font-size:12.5px}
.portrait .board.v2 .wrow .wl{font-size:11px}
.pmsw{display:flex;justify-content:center;gap:2px;margin:-4px 0 8px}
.pmsw button{font-size:11.5px;padding:3px 12px;border-radius:999px;color:#888}
.pmsw button.on{background:var(--hover);color:var(--ink)}
.pagehint{text-align:center;font-size:10px;color:#bbb;letter-spacing:.04em;padding:6px 0 2px}
.pwk{margin-top:14px}
.pwk .wh{font-size:12px;padding-bottom:4px;display:flex;gap:7px}
.pwk .wkbox{border:var(--lw) solid var(--line);border-radius:var(--r)}
.pwk .wrow{cursor:default;padding:8px 10px}
.pwk .wrow .it,.pwk .wrow .wadd,.pwk .wrow .add{font-size:14px;padding:2px 0}
.qbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--paper);border-top:var(--lw) solid var(--soft);padding:8px max(14px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px))}
.qbar .qchips{display:none;padding:0 0 7px}
.qbar:focus-within .qchips{display:flex}
.qbar .add{font-size:15px;align-items:center}
.qbar .add .ck{margin-top:0}
.qbar .day{font-size:11px;color:var(--mute);white-space:nowrap}
.portrait main.qpad{padding-bottom:76px}
.slide-up{animation:slideUp .3s var(--ease)}
.slide-down{animation:slideDown .3s var(--ease)}
.slide-left{animation:slideLeft .28s var(--ease)}
.slide-right{animation:slideRight .28s var(--ease)}
@keyframes slideUp{from{transform:translateY(36px);opacity:0}to{transform:none;opacity:1}}
@keyframes slideDown{from{transform:translateY(-36px);opacity:0}to{transform:none;opacity:1}}
@keyframes slideLeft{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes slideRight{from{transform:translateX(-40px);opacity:0}to{transform:none;opacity:1}}

/* ---------- 할일 page ---------- */
.hal{display:flex;flex-direction:column;height:100%;gap:8px}
.hrow{display:flex;align-items:center;gap:6px;overflow-x:auto;flex:none;padding:1px 1px 3px;scrollbar-width:none}
.hrow::-webkit-scrollbar{display:none}
.hchip{flex:none;display:flex;align-items:center;gap:7px;height:34px;padding:0 13px 0 5px;border-radius:999px;border:var(--lw) solid var(--soft);font-size:13px;color:#555;transition:background .15s,border-color .15s}
.hchip:first-child{padding:0 14px}
.hchip small{font-size:10px;color:var(--mute);font-variant-numeric:tabular-nums}
.hchip:hover{border-color:var(--faint)}
.hchip.on{border-color:var(--ink);color:var(--ink);box-shadow:inset 0 0 0 .5px var(--ink)}
.hrow.s .hchip{height:26px;padding:0 11px;font-size:12px;gap:6px}
.hrow.s .hchip.on{background:var(--ink);color:var(--paper);box-shadow:none}
.hrow.s .hchip.on small{color:#bbb}
.hrow .add{flex:none;width:96px;font-size:12px;padding:0 4px}
.hrow.s .hint{font-size:11px;color:#bbb;padding-left:4px}
.ring{position:relative;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring svg circle{fill:none}
.ring .rin{position:relative;font-size:.46em;line-height:1}
.hbody{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,1fr);grid-template-rows:18px auto;column-gap:16px;margin-top:4px;align-items:start}
.hbody.wide{grid-template-columns:minmax(0,1fr)}
.hbody .whl{grid-column:1;font-size:12px;letter-spacing:.04em;display:flex;align-items:flex-end;gap:8px;padding-bottom:3px}
.hbody .whl small{font-size:10px;color:var(--mute);letter-spacing:0}
.htable{grid-column:1;grid-row:2;border:var(--lw) solid var(--line);border-radius:var(--r);min-width:0}
#app:not(.portrait) main.scroll{overflow-y:auto;padding-right:2px}
.ht{display:grid;min-width:0}
.hh{position:sticky;top:0;z-index:3;background:var(--paper);font-size:12px;padding:6px 10px 5px;border-bottom:var(--hl) solid var(--soft);display:flex;align-items:center;gap:6px;white-space:nowrap;min-width:0;overflow:hidden;border-radius:var(--r) var(--r) 0 0}
.hh small{font-size:10px;color:var(--mute);margin-left:auto}
.hh.c2{top:26px;border-radius:0}
.hh.cat{padding:4px 10px;border-bottom:0;font-size:11.5px;color:var(--sub);height:26px}
.hh.subh{cursor:pointer}
.hh.subh:hover{background:#fafafa}
.hlab{display:flex;align-items:center;gap:5px;padding:0 0 0 9px;font-size:11px;color:var(--sub);border-top:var(--hl) solid var(--hair);font-variant-numeric:tabular-nums;min-height:22px}
.hlab b{font-weight:400;font-size:12px;color:var(--ink)}
.hlab span{font-size:9.5px;color:#b0b0b0;letter-spacing:.04em}
.hlab.blk,.pc.blk{border-top:var(--hl) solid var(--faint)}
.hlab.td b{background:var(--ink);color:var(--paper);border-radius:2px;padding:0 3px}
.hlab.go{cursor:pointer}
.hlab.go:hover b{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--faint)}
.hwk{display:flex;align-items:center;justify-content:center;font-size:10.5px;color:#9a9a9a;letter-spacing:.03em;border-top:var(--hl) solid var(--faint);border-right:var(--hl) solid var(--hair);writing-mode:horizontal-tb}
.hwk:hover{background:var(--hover);color:var(--ink)}
.hwk.td{color:var(--ink)}
.pc{position:relative;border-top:var(--hl) solid var(--hair);border-left:var(--hl) solid var(--hair);cursor:copy;display:flex;align-items:center;min-width:0;min-height:30px}
.pc:hover{background:#fbfbfb}
.pc.td{background:#fafafa}
.ht.week .pc,.ht.week .hlab{min-height:44px}
.ht.month .pc,.ht.month .hlab{min-height:22px}
.ht.year .pc,.ht.year .hlab{min-height:34px}
.ht.week .pc:not(.none){min-height:64px}
.pin{display:flex;flex-direction:column;justify-content:center;gap:3px;padding:4px 8px 4px calc(10px + var(--n)*5px);min-width:0;width:100%}
.ht.month .pin{padding-top:2px;padding-bottom:2px;gap:1px}
.pm{position:relative;z-index:2;display:flex;align-items:center;gap:7px;min-width:0;font-size:12.5px;line-height:1.3;-webkit-touch-callout:none;user-select:none}
.pm .ck{margin-top:0;font-size:12px}
.pdot{flex:none;width:18px;height:18px;border-radius:50%;border:var(--lw) solid var(--ink);background:var(--paper);font-size:9.5px;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;transition:transform .15s}
.pdot:hover{transform:scale(1.08)}
.pm.done .pdot{background:var(--ink);color:var(--paper)}
.pm.now .pdot{box-shadow:0 0 0 2px var(--paper),0 0 0 3px var(--ink)}
.pm.late .pdot{border-style:dashed}
.pm .pt{min-width:0;cursor:pointer;word-break:keep-all}
.pm.done .pt{color:var(--mute);text-decoration:line-through}
.pm small{flex:none;font-size:10px;color:var(--mute);font-variant-numeric:tabular-nums;margin-left:auto}
.pm .tag{flex:none;font-size:10px;color:#777;background:var(--tag);border-radius:3px;padding:0 5px}
.pst{position:relative;z-index:2;display:flex;align-items:center;gap:7px;font-size:11px;color:#9a9a9a;min-width:0}
.pst button{flex:none;width:10px;height:10px;margin:0 4px;border-radius:2px;border:var(--lw) solid #b3b3b3;background:var(--paper)}
.pst button.done{background:var(--ink);border-color:var(--ink)}
.pst.done span{text-decoration:line-through;color:#bbb}
.pst.dotonly span{display:none}
.pst span{cursor:pointer;flex:1;min-width:0}   /* the whole row opens it, not only the letters */
.pst span:hover,.pm .pt:hover{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--faint)}
.pm.rtn.run .pt{color:var(--mute)}
.pm.rtn.run .pdot{border-color:var(--faint);box-shadow:none}
/* 할일 루틴: a plain square at its end, never the ring or the dashed "late" border */
.pm.rtn .pdot{box-shadow:none;border-style:solid}
.ldot.run i{background:#c4c4c4}
/* a 루틴's last day: the same size as its other days, only darker */
.pst.end{color:var(--ink)}
.pst.end button{border-color:var(--ink)}
.pst button:disabled{cursor:default}
/* 설정 → 할일 페이지 연 · 월 표시: one row of on/off chips */
.hfrow{display:flex;gap:6px;flex-wrap:wrap}
.hft{height:32px;padding:0 16px;border:var(--lw) solid var(--soft);border-radius:999px;font-size:13px;color:#888;transition:background .15s,color .15s}
.hft:hover{border-color:var(--faint)}
.hft.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
/* 삭제 → 정말 삭제하시겠습니까? */
.foot.ask{background:#fafafa}
.askq{display:flex;flex-direction:column;font-size:13.5px;gap:2px}
.askq small{font-size:11px;color:var(--mute)}
.delseg{height:30px}
.vopt .fdel{position:absolute;top:4px;right:6px;width:20px;height:20px;display:flex;align-items:center;justify-content:center;border-radius:4px;color:#aaa;font-size:13px}
.vopt .fdel:hover{background:var(--hover);color:var(--ink)}
.vopt{position:relative}
.fontadd{display:flex;gap:6px;margin-top:10px}
.fontadd input{flex:1;min-width:0;border:var(--lw) solid var(--soft);border-radius:6px;padding:6px 10px;font-size:13px;outline:none;background:transparent}
.fontadd input:focus{border-color:var(--ink)}
/* 설정 → 동기화 */
.syform{display:flex;flex-direction:column;gap:6px;margin:4px 0 2px;max-width:340px}
.syform input{border:var(--lw) solid var(--soft);border-radius:6px;padding:8px 10px;font-size:14px;outline:none;background:transparent}
.syform input:focus{border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
/* 설정 → 데이터: backup */
.bakrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
#imptext,#baktext{display:block;width:100%;height:96px;margin-top:8px;border:var(--lw) solid var(--soft);border-radius:6px;padding:8px;font:11.5px/1.4 ui-monospace,Consolas,monospace;resize:vertical;background:transparent;color:inherit;outline:none}
#imptext:focus,#baktext:focus{border-color:var(--ink)}
.impask{margin-top:10px;padding:10px 12px;border:var(--lw) solid var(--ink);border-radius:8px;display:flex;flex-direction:column;gap:3px;font-size:13px}
.impask b{font-weight:500}
.impask small{color:var(--mute);font-size:11.5px}
.bakmsg{margin-top:8px;font-size:12px;color:var(--sub);line-height:1.5}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--paper);font-size:13px;padding:9px 14px;border-radius:10px;display:flex;gap:14px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:calc(100% - 32px)}
.toast button{color:var(--paper);text-decoration:underline;text-underline-offset:3px;font-size:13px;white-space:nowrap}
.ht.month .pm{font-size:11.5px}
.ht.month .pm .pt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 1 · 표: a running milestone shows as a bar on the cell's left edge (one bar per lane) */
.ln{position:absolute;top:0;bottom:0;pointer-events:none}
.ht.v1 .ln{left:calc(var(--j)*5px + 1px);width:3px;background:#d4d4d4}
.ht.v1 .ln.now{background:#8c8c8c}
/* 2 · 로드맵: each 세부할일 is one long line (lanes side by side); circles sit on their line */
.ht.v2 .pc,.ht.v2 .hlab{border-top-color:transparent;border-left-color:transparent}
.ht.v2 .pc.blk,.ht.v2 .hlab.blk{border-top:var(--hl) dashed var(--soft)}
.ht.v2 .pc:hover{background:transparent}
.ht.v2 .ln{left:calc(20px + var(--j)*16px);width:3px;margin-left:-1.5px;background:#cfcfcf;border-radius:0}
.ht.v2 .ln.now{background:#7d7d7d}
.ht.v2 .ln.start{top:50%}
.ht.v2 .ln.end{bottom:50%}
.ht.v2 .ln.start.end{display:none}
.ht.v2 .ln.base{width:1px;margin-left:-.5px;background:#ececec;top:0;bottom:0}
.ht.v2 .pin{padding-left:calc(26px + var(--n)*16px)}
.ht.v2 .pdot{position:absolute;left:calc(20px + var(--j)*16px - 12px);width:24px;height:24px;font-size:11px}
.ht.v2 .pm{position:static}
.ht.v2 .pm>.pdot{z-index:3}
.ht.v2 .pst{position:static}
.ht.v2 .pst button{position:absolute;left:calc(20px + var(--j)*16px - 5px);margin:0}
.ht.v2 .pin{position:relative}
.ht.v2.month .pdot{width:20px;height:20px;font-size:10px;left:calc(20px + var(--j)*16px - 10px)}
.ht.v2 .pm.gen{padding-left:0}
/* 3 · 목록 */
.hlist{display:flex;flex-direction:column}
.hb{border-top:var(--hl) solid var(--soft);padding:8px 12px 10px}
.hb:first-child{border-top:0}
.hb.td{background:#fbfbfb}
.hbh{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.hbl{font-size:12.5px;font-weight:400}
.hbl[data-act]:hover{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--faint)}
.going{font-size:10.5px;color:#888;border:var(--hl) solid var(--faint);border-radius:999px;padding:0 7px}
.hbadd{margin-left:auto;width:22px;height:22px;border-radius:50%;color:#bbb;font-size:14px}
.hbadd:hover{background:var(--hover);color:var(--ink)}
.hbb{display:flex;flex-direction:column;gap:3px;padding-left:2px}
.hbb .ld{font-size:10px;color:#aaa;margin-top:3px;font-variant-numeric:tabular-nums}
.hbb .nil{color:#ddd;font-size:12px}
.hlist .pdot{width:18px;height:18px}
/* going down a level */
.ht [data-rk],.hlist [data-rk]{transition:max-height .45s var(--ease),min-height .45s var(--ease),padding .45s var(--ease),opacity .3s ease}
.xa{overflow:hidden}
.xf{max-height:0!important;min-height:0!important;padding-top:0!important;padding-bottom:0!important;opacity:0;border-color:transparent!important}
.hstack{grid-column:2;grid-row:2;border:var(--lw) solid var(--line);border-radius:var(--r);padding:7px 9px;display:flex;flex-direction:column;gap:1px;position:sticky;top:0;max-height:calc(100vh - 150px);overflow:auto}
.hbody .whs{grid-column:2;grid-row:1;font-size:12px;display:flex;align-items:flex-end;gap:7px;padding-bottom:3px;letter-spacing:.04em}
.whs small{font-size:10px;color:var(--mute)}
.hstack .it,.hstack .add,.hstack .wadd{font-size:12px}
.hstack .note2{font-size:10.5px;color:#bbb;line-height:1.5;padding-top:12px}
.empty{color:var(--mute);font-size:13px;line-height:1.6;padding:16px}
.empty b{display:block;color:var(--ink);font-weight:400;font-size:14px}
.portrait .hal{height:auto}
.portrait .hbody{grid-template-columns:minmax(0,1fr);grid-template-rows:auto;row-gap:6px}
.portrait .hbody>*{grid-column:1!important;grid-row:auto!important}
.portrait .hh{position:static}
.portrait .hstack{min-height:120px}

/* week page extras */
.sb{border:var(--hl) solid #e3e3e3;border-radius:5px;margin:2px -4px 3px;padding:0 3.5px 2px}
.sb .sl{display:block;font-size:.72em;color:#bdbdbd;line-height:1.5;letter-spacing:.02em}
.whb{font:inherit;letter-spacing:inherit}
.whb:hover{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--faint)}
.wlist{display:flex;flex-direction:column;gap:1px;min-height:0}
.wrow .it.sum .tx{color:var(--sub)}
.days.one{grid-template-columns:minmax(0,1fr)}
.days.one .dcol{border-right:0;padding:12px 12px 20px}
.days.one .dlist{font-size:14px;gap:2px}
.portrait .dow .dw{cursor:pointer;padding-bottom:1px}
.portrait .dow .dw.sel{color:var(--ink);font-weight:500;box-shadow:inset 0 -1.5px 0 var(--ink)}
.dwrap{height:100%;overflow:auto;touch-action:pan-y}
.qa.h .ck{margin-top:.225em}
.sd b{font-weight:400;color:var(--ink)}
.portrait .board.v2 .cal{transition:border-color .3s}
.portrait .board.v2.pgoal .cal{border-color:transparent}

/* month weekly rows: same geometry as a calendar cell (label like a date number, list below) so three rows always fit */
.month .wrow{position:relative;display:block;padding:0}
.month .wrow .wl{position:absolute;left:7px;top:3px;margin:0;line-height:12px;height:12px}
.month .wrow .wlist{position:absolute;left:0;right:0;top:17px;bottom:0;padding:1px 8px 4px;overflow:hidden;transition:top .5s var(--ease)}
.month .wrow .wlist .it,.month .wrow .wlist .wadd{font-size:11px}
.unfold .wrow:not(.fold) .wlist{top:6px;padding-top:1px}
.portrait .board.v2 .month .wrow .wlist .it{font-size:12.5px}
.portrait .board.v2 .wrow .wlist .it,.portrait .board.v2 .wrow .wlist .wadd{font-size:12.5px}
.portrait .board.v2 .wrow .wlist{top:20px}
.cb .wadd{font-size:inherit;padding:1px 0}
.cb .wadd .ck,.dcol .wadd .ck{margin-top:0}
.dcol .wadd{font-size:inherit;margin-top:2px}
.portrait .board.week.v2{grid-template-rows:16px auto}
.portrait .board.week .wkbox{height:auto}
/* one-line bar (version 3) */
.qpop{position:fixed;z-index:40;display:flex;align-items:center;gap:8px;height:44px;padding:0 6px 0 12px;background:var(--paper);border:var(--lw) solid var(--ink);border-radius:999px;box-shadow:0 8px 28px rgba(0,0,0,.14);animation:qpin .16s var(--ease)}
@keyframes qpin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.qpop.bottom{left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));top:auto}
.qpm{flex:none;display:flex;align-items:center;gap:5px;font-size:12px;color:#777;padding:4px 8px 4px 4px;border-radius:999px;white-space:nowrap}
.qpm .ck{margin:0;font-size:13px}
.qpm:not(.still):hover{background:var(--hover);color:var(--ink)}
#qin{flex:1;min-width:90px;border:0;outline:none;background:transparent;font-size:14px;padding:0}
#qin::placeholder{color:#bdbdbd}
.qps{flex:0 1 auto;max-width:56%;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.qps::-webkit-scrollbar{display:none}
.qps.warn{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.qc,.qd{flex:none;font-size:11.5px;line-height:1.2;padding:4px 9px;border:var(--lw) solid var(--soft);border-radius:999px;color:#666;white-space:nowrap}
.qc.on,.qd.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.qc.back{border-color:var(--ink);color:var(--ink)}
.qd{padding:4px 7px}
/* 할일 table: never spill into the next column; a faint + on hover */
.pc{overflow:hidden}
.pm .pt{overflow-wrap:anywhere}
.pcplus{position:absolute;right:7px;top:50%;transform:translateY(-50%);font-size:13px;color:#c8c8c8;opacity:0;pointer-events:none}
.pc:hover .pcplus{opacity:1}
.ht.v2 .pcplus{right:6px}
.portrait .board.v2 .days{transition:border-color .3s}
.portrait .board.v2.pgoal .days{border-color:transparent}

/* 할일 · month by weeks */
.ht.month.range .pc,.ht.month.range .hlab{min-height:44px}
.ht.range .pm .pn{display:none}
.pn{display:none;font-style:normal;font-size:10px;color:var(--mute);margin-right:5px;font-variant-numeric:tabular-nums}
/* 배치 2·3: rows = 세부할일, columns = time */
.htable{overflow-x:auto}
.ht.tp .tlab{position:sticky;top:0;z-index:2;background:var(--paper);display:flex;align-items:baseline;justify-content:center;gap:4px;padding:6px 2px 5px;font-size:11px;color:var(--sub);border-bottom:var(--hl) solid var(--soft);border-left:var(--hl) solid var(--hair);font-variant-numeric:tabular-nums;white-space:nowrap}
.ht.tp .tlab b{font-weight:400;font-size:12px;color:var(--ink)}
.ht.tp .tlab span{font-size:9.5px;color:#b0b0b0}
.ht.tp .tlab.blk{border-left-color:var(--faint)}
.ht.tp .tlab.td b{background:var(--ink);color:var(--paper);border-radius:2px;padding:0 3px}
.ht.tp .tlab.go{cursor:pointer}
.ht.tp .tlab.go:hover b{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--faint)}
.hwk.t{border-top:0;border-right:0;border-left:var(--hl) solid var(--faint);border-bottom:var(--hl) solid var(--hair);height:22px}
.ht.tp .hh.v{position:sticky;left:0;top:auto;z-index:2;border-radius:0;border-bottom:var(--hl) solid var(--hair);border-right:var(--hl) solid var(--soft);white-space:normal;align-items:center}
.ht.tp .hh.cat.v{height:auto;flex-direction:column;justify-content:center;gap:4px;font-size:11px;text-align:center}
.ht.tp .hh.subh.v small{margin-left:auto}
.ht.tp .hh.corner{top:0;border-bottom:var(--hl) solid var(--soft)}
.ht.tp .pc{min-height:64px;align-items:flex-start;border-top:var(--hl) solid var(--hair)}
.ht.tp .pc.blk{border-left:var(--hl) solid var(--faint);border-top:var(--hl) solid var(--hair)}
.ht.tp .pin{padding:calc(8px + var(--n)*5px) 6px 6px 6px}
.ht.tp .pm{font-size:11.5px}
.ht.tp .pm .pt{white-space:normal}
.ht.tp.v1 .ln{left:0;right:0;top:calc(var(--j)*5px + 1px);bottom:auto;width:auto;height:3px}
/* 로드맵 on its side: each 세부할일 is one long horizontal track; circles sit on it, words below */
.ht.tp.v2 .pc,.ht.tp.v2 .hh.v{border-top-color:transparent}
.ht.tp.v2 .ln{left:0;right:0;top:calc(16px + var(--j)*16px);bottom:auto;width:auto;height:3px;margin:-1.5px 0 0}
.ht.tp.v2 .ln.base{height:1px;margin-top:-.5px;left:0;right:0}
.ht.tp.v2 .ln.start{left:50%;top:calc(16px + var(--j)*16px)}
.ht.tp.v2 .ln.end{right:50%;bottom:auto}
.ht.tp.v2 .ln.start.end{display:none}
.ht.tp.v2 .pin{padding:calc(30px + (var(--n) - 1)*16px) 6px 6px}
.ht.tp.v2 .pdot{position:absolute;left:calc(50% - 11px + var(--k)*24px);top:calc(16px + var(--j)*16px - 11px);width:22px;height:22px}
.ht.tp.v2 .pm .pn{display:inline}
.ht.tp.v2 .pst button{position:absolute;left:calc(50% - 5px);top:calc(16px + var(--j)*16px - 5px);margin:0}
.ht.tp.v2 .pst span{display:none}
.ht.tp.v2 .pst{position:static;height:0}
/* 배치 3: lists on the left, 보관함 underneath */
.hal.tp3{display:grid;grid-template-columns:150px minmax(0,1fr);column-gap:18px;align-items:start;height:auto}
.hside{display:flex;flex-direction:column;gap:14px;position:sticky;top:0}
.hal.tp3 .hrow{flex-direction:column;align-items:stretch;overflow:visible;gap:5px}
.hal.tp3 .hrow .hchip{justify-content:flex-start}
.hal.tp3 .hrow .add{width:auto}
.hal.tp3 .hbody{grid-template-columns:minmax(0,1fr);grid-template-rows:18px auto 26px auto;margin-top:0}
.hal.tp3 .htable{grid-row:2}
.hal.tp3 .whs{grid-column:1;grid-row:3}
.hal.tp3 .hstack{grid-column:1;grid-row:4;position:static;max-height:none;flex-direction:row;flex-wrap:wrap;gap:3px 18px;align-items:center}
.hal.tp3 .hstack .gh{flex-basis:100%}
.hal.tp3 .hstack .note2{flex-basis:100%;padding-top:4px}

/* ===== chosen versions: square marks for milestones everywhere, same weight as other text ===== */
.it.msi .tx{font-weight:inherit}
.pdot{width:13px;height:13px;border-radius:2px;font-size:0;border:var(--lw) solid var(--ink)}
.pm.done .pdot{background:var(--ink)}
.pm.now .pdot{box-shadow:0 0 0 2px var(--paper),0 0 0 3px var(--ink)}
.pdot.g{border-color:#8a8a8a}
.pm.gen.done .pdot{background:var(--ink);border-color:var(--ink)}
.ht.v2 .pdot,.ht.v2.month .pdot{width:13px;height:13px;left:calc(20px + var(--j)*16px - 6.5px)}
.hlist .pdot{width:13px;height:13px}
/* 1-2: no wrapping — the column widens to fit */
.ht.wide .pm .pt{white-space:nowrap;overflow:visible}
.ht.wide .pc{overflow:visible}
/* 2 · 3 turned on its side: entries stand side by side on the track, words under each mark, nothing cut */
.ht.tp .pm .pt{white-space:nowrap}
.ht.tp.v2 .pin{flex-direction:row;align-items:flex-start;flex-wrap:nowrap;gap:14px;padding:0 10px 8px;justify-content:flex-start}
.ht.tp.v2 .pm{position:relative;flex-direction:column;align-items:flex-start;gap:0;padding-top:calc(16px + (var(--n) - 1)*16px + 12px)}
.ht.tp.v2 .pdot{position:absolute;left:0;top:calc(16px + var(--j)*16px - 6.5px);width:13px;height:13px}
.ht.tp.v2 .pm small{margin:1px 0 0}
.ht.tp.v2 .pst{position:relative;height:auto;padding-top:calc(16px + (var(--n) - 1)*16px)}
.ht.tp.v2 .pst button{left:0;top:calc(16px + var(--j)*16px - 5px)}
.ht.tp .pc{overflow:visible}

/* title parts that slide in and out with the 연/월/주 knob */
.ptl{display:inline-flex;align-items:baseline}
.ts{display:inline-block;overflow:hidden;white-space:nowrap;transition:max-width .34s var(--ease),opacity .28s ease}
.ts.off{max-width:0;opacity:0}
.ts .tv{font-weight:inherit}

/* ===== round 14 ===== */
/* title: 2026 11 week4 — no dots, tight, week a little smaller; 2026 / 11 open the year / month */
.ptl .ts{padding-left:.34em}
.ptl .ts.y{padding-left:0}
.ptl .ts.w{font-size:.8em}
.ptl button.ts,.ptl button.tv{font:inherit;color:inherit;letter-spacing:inherit;line-height:inherit;cursor:pointer;border-radius:3px}
.ptl button.ts:hover,.ptl button.tv:hover{background:var(--hover)}
/* narrower weekly-goal column (month and week alike, so the unfold still lines up) */
.board{grid-template-columns:minmax(0,4.4fr) minmax(0,1fr)}
/* Mon… row and WEEKLY row on one baseline */
.dow,.wh{height:18px;line-height:14px;align-items:flex-end;padding-bottom:3px;font-size:12px}
.dow .dw{line-height:14px}
.wh>span,.wh>.whb{line-height:14px;display:block}
.wh .fbtn{align-self:center;margin-bottom:-2px}
/* the same square for every to-do (daily shares included) */
.ck.st{transform:none;border-color:var(--ink);border-radius:.16em}
/* routine marks (설정 → 루틴 표시) */
.ck.rt i{display:none}
.ck.rt.rk-rsq{border-radius:.3em}
.ck.rt.rk-dot i{display:block;width:.26em;height:.26em;border-radius:50%;background:currentColor;font-size:inherit}
.ck.rt.rk-dot.done i{background:var(--paper)}
/* 형광펜: the whole row gets the same-size stripe, whatever the length of the words */
#app.hl-ev .board .it.k-ev,#app.hl-td .board .it.k-td,#app.hl-rt .board .it.k-rt,
#app.hl-ev .pwk .it.k-ev,#app.hl-td .pwk .it.k-td,#app.hl-rt .pwk .it.k-rt{border-radius:2px;margin:1px -3px;padding:0 3px}
#app.hl-ev .board .it.k-ev{background:var(--hl-ev)}
#app.hl-td .board .it.k-td{background:var(--hl-td)}
#app.hl-rt .board .it.k-rt{background:var(--hl-rt)}
.board .it.done{background-blend-mode:normal}
.hlrow{display:flex;align-items:center;gap:7px;padding:6px 0}
.hlrow .it{width:84px;font-size:13px;flex:none}
.sw3{width:24px;height:24px;border-radius:5px;background:var(--c);border:var(--lw) solid transparent;font-size:11px;color:#aaa}
.sw3.none{background:var(--paper);border-color:var(--soft)}
.sw3.on{box-shadow:0 0 0 1.5px var(--ink)}
/* 요약 끄기: rows grow to show everything */
.board.month.full{height:auto;grid-template-rows:18px auto}
.full .cell{contain:none}
.full .cb{position:static;padding-top:19px}
.full .cell .d{z-index:1}
.full .wrow .wlist{position:static;padding-top:19px}
.full .cb .it .tx{white-space:normal}
#app:not(.portrait) main.scroll #pg{height:auto}
/* 할일 marks: 일반 = square · 이정표 = larger circle · 루틴 = routine mark */
.pdot.g{border-radius:2px;border-color:var(--ink)}
.pdot.c{width:17px;height:17px;border-radius:50%}
.pdot.r.rk-rsq{border-radius:4px}
.pdot.r.rk-dot{border-radius:2px}
.pdot.r.rk-dot::after{content:"";display:block;width:4px;height:4px;margin:auto;border-radius:50%;background:var(--ink)}
.pm.done .pdot,.rn.done .pdot{background:var(--ink)}
.pm.done .pdot.r.rk-dot::after,.rn.done .pdot.r.rk-dot::after{background:var(--paper)}
.ht.v2 .pdot.c{width:17px;height:17px;left:calc(20px + var(--j)*16px - 8.5px)}
.ht.tp.v2 .pdot.c{left:-2px;top:calc(16px + var(--j)*16px - 8.5px)}
.until{font-style:normal;color:var(--mute);font-size:.86em}
.pm.star .pt{font-weight:inherit}
/* 로드맵 2 · one unbroken path per 세부할일 */
.htable.road{border:0;overflow:visible}
.rmap{display:grid;grid-template-columns:repeat(var(--cols),minmax(170px,1fr));gap:0 22px;align-items:start}
.rcol{min-width:0;display:flex;flex-direction:column;padding:0 0 10px}
.rhd{display:flex;align-items:baseline;gap:6px;font-size:13px;padding:2px 0 10px;border-bottom:var(--lw) solid var(--line);margin-bottom:6px;text-align:left}
.rhd span{font-size:10.5px;color:var(--mute)}
.rhd small{margin-left:auto;font-size:10px;color:var(--mute)}
.rpath{position:relative;display:flex;flex-direction:column}
.rstep{position:relative;padding:7px 0}
.rstep::before{content:"";position:absolute;left:46px;top:0;bottom:0;width:1.5px;margin-left:-.75px;background:#d9d9d9}
.rstep:first-child::before{top:50%}
.rstep:last-child::before{bottom:50%}
.rstep:only-child::before{display:none}
.rstep.on::before{background:#7d7d7d;width:3px;margin-left:-1.5px;top:-50%}
.rstep.on:first-child::before{top:0}
.rn{position:relative;z-index:1;display:grid;grid-template-columns:34px 24px minmax(0,1fr);align-items:center;column-gap:0;font-size:12.5px;-webkit-touch-callout:none;user-select:none}
.rn .rd{font-size:10px;color:#a0a0a0;text-align:right;padding-right:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.rn .rk{justify-self:center;position:static;transform:none;margin:0;background:var(--paper)}
.rn .pdot.g,.rn .pdot.r{width:13px;height:13px}
.rn .rt{padding-left:6px;line-height:1.35;overflow-wrap:anywhere;cursor:pointer}
.rn.done .rt{color:var(--mute);text-decoration:line-through}
.rn.now .pdot{box-shadow:0 0 0 2px var(--paper),0 0 0 3px var(--ink)}
.rn.today .rd{color:var(--ink)}
.rn .tick{width:15px;height:0;border-top:1.5px dashed var(--ink);background:none}
.rn.step .rk.sq{width:9px;height:9px;border:var(--lw) solid #a8a8a8;border-radius:2px}
.rn.step .rk.sq.done{background:var(--ink);border-color:var(--ink)}
.rn.step .rt{font-size:11px;color:#9a9a9a}
.rnil{font-size:11.5px;color:#c8c8c8;padding:8px 0 4px 40px}
.rcol>.wadd{margin:4px 0 0 40px}
/* turned on its side: each 세부할일 is a row, the path runs left → right */
.rmap.tp{grid-template-columns:minmax(0,1fr);gap:16px}
.rmap.tp .rcol{display:grid;grid-template-columns:110px minmax(0,1fr) auto;align-items:center;column-gap:12px;border-bottom:var(--hl) solid var(--soft);padding:4px 0 10px}
.rmap.tp .rhd{border:0;margin:0;padding:0;flex-direction:column;align-items:flex-start;gap:2px}
.rmap.tp .rhd small{margin-left:0}
.rmap.tp .rpath{flex-direction:row;overflow-x:auto;padding-bottom:2px}
.rmap.tp .rstep{padding:0 10px}
.rmap.tp .rstep::before{left:0;right:0;top:28px;bottom:auto;width:auto;height:1.5px;margin:0}
.rmap.tp .rstep:first-child::before{left:50%;top:28px}
.rmap.tp .rstep:last-child::before{right:50%;bottom:auto}
.rmap.tp .rstep.on::before{height:3px;margin-top:-.75px;left:-50%}
.rmap.tp .rstep.on:first-child::before{left:0}
.rmap.tp .rn{grid-template-columns:auto;grid-template-rows:18px 22px auto;justify-items:center;min-width:76px;max-width:150px}
.rmap.tp .rn .rd{padding:0;text-align:center}
.rmap.tp .rn .rt{padding:2px 0 0;text-align:center;white-space:nowrap}
.rmap.tp .rnil{padding:6px 0}
.rmap.tp .rcol>.wadd{margin:0}
.hal.tp3 .rmap.tp .rcol{grid-template-columns:110px minmax(0,1fr) auto}
.rn.later .rd{color:#bbb}

/* ===== round 15 ===== */
#app.hl-hg .board .it.k-hg{border-radius:2px;margin:1px -3px;padding:0 3px;background:var(--hl-hg)}
.qend{display:flex;align-items:center;gap:3px;font-size:11px;color:#999;flex:none}
.qend input{font-size:11px;border:var(--lw) solid var(--soft);border-radius:999px;padding:2px 6px;background:var(--paper)}
.chip.star{border-color:var(--soft);color:#555}
.chip.star.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
/* roadmap: a firm line separates the date column, so the road lines read as roads, not table lines */
.ht .hlab,.ht .hwk,.ht .hh.corner{border-right:var(--lw) solid var(--line)}
.ht.v2 .pc.blk{border-top-color:transparent}
.ht.v2 .hlab.blk{border-top:var(--hl) solid var(--soft)}
.ht.v2 .hlab{border-top-color:transparent}
.ht.v2 .hlab.blk{border-top-color:var(--soft)}

/* ===== round 16 ===== */
/* 할일: the dates and the roadmap are two separate blocks */
.htable:has(.ht.split){border:0;border-radius:0}
.ht.split .hh.corner{border:var(--lw) solid var(--line);border-bottom:var(--hl) solid var(--soft);border-radius:var(--r) var(--r) 0 0}
.ht.split .hlab{border-left:var(--lw) solid var(--line);border-right:var(--lw) solid var(--line)}
.ht.split .hlab.rl{border-bottom:var(--lw) solid var(--line);border-radius:0 0 var(--r) var(--r)}
.ht.split .hh.top,.ht.split .hh.cat{border-top:var(--lw) solid var(--line)}
.ht.split .hh.cf,.ht.split .pc.cf{border-left:var(--lw) solid var(--line)}
.ht.split .hh.cl,.ht.split .pc.cl{border-right:var(--lw) solid var(--line)}
.ht.split .hh.cf{border-top-left-radius:var(--r)}
.ht.split .hh.cl{border-top-right-radius:var(--r)}
.ht.split .hh.c2.cf,.ht.split .hh.c2.cl{border-radius:0}
.ht.split .pc.rl{border-bottom:var(--lw) solid var(--line)}
.ht.split .pc.rl.cf{border-bottom-left-radius:var(--r)}
.ht.split .pc.rl.cl{border-bottom-right-radius:var(--r)}
.ht.split.v2 .pc.cf{border-left-color:var(--line)}
.ht.split .pc.cf .ln{margin-left:0}
/* 연 / 월: everything except 이정표 is just a small dot */
.dots{display:flex;flex-wrap:wrap;gap:4px;padding:2px 0 0 2px}
.mdot{width:6px;height:6px;border-radius:50%;background:#9a9a9a}
.mdot.done{background:#d0d0d0}
.ht.v2 .dots{padding-left:0}
/* the one-row bar: range button + small calendar */
.qc.cal{display:flex;align-items:center;gap:5px}
.qci{width:13px;height:13px}
.qc.more{color:#999}
.qcal{position:absolute;right:8px;top:calc(100% + 6px);width:252px;background:var(--paper);border:var(--lw) solid var(--ink);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.14);padding:10px 10px 8px;z-index:2}
.qcal.up{top:auto;bottom:calc(100% + 6px)}
.qcal.warn{animation:shake .3s}
.qcal.warn .hint{color:var(--ink)}
.qch{display:flex;align-items:center;justify-content:space-between;padding:0 2px 6px;font-size:13px}
.qch b{font-weight:400}
.qch button{width:26px;height:24px;border-radius:6px;font-size:15px;color:#777}
.qch button:hover{background:var(--hover);color:var(--ink)}
.qcg{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px;text-align:center}
.qcg span{font-size:10px;color:#aaa;padding-bottom:3px}
.qcd{height:28px;font-size:12px;font-variant-numeric:tabular-nums;border-radius:6px;position:relative}
.qcd:hover{background:var(--hover)}
.qcd.out{color:#cfcfcf}
.qcd.td{font-weight:500}
.qcd.in,.qcd.s,.qcd.e{box-shadow:inset 0 -2px 0 var(--ink);border-radius:0}
.qcd.s,.qcd.e{background:var(--ink);color:var(--paper);border-radius:6px;box-shadow:none}
.qcd.open:hover{box-shadow:inset 0 -2px 0 #bbb}
.qcf{display:flex;align-items:center;gap:6px;padding-top:8px;font-size:11px;color:#999}
.qcf span{margin-right:auto}
.qcf button{font-size:11px;padding:3px 9px;border-radius:999px;border:var(--lw) solid var(--soft);color:#666}
.qcf button.ok{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.qpop.bottom .qcal{right:0;left:0;margin:auto}

/* ===== round 17 ===== */
#app.hl-hg .board .it.k-hg,#app.hl-hg .pwk .it.k-hg{border-radius:2px;margin:1px -3px;padding:0 3px;background:var(--hl-hg)}
/* 할일: names sit above the two boxes, like Mon… above the calendar */
.ht.split .hh{border:0!important;border-radius:0!important;padding:0 10px 4px;align-items:flex-end;font-size:12px}
.ht.split .hh.cat{font-size:11px;color:var(--mute);padding-bottom:2px}
.ht.split .hlab.r0{border-top:var(--lw) solid var(--line);border-radius:var(--r) var(--r) 0 0}
.ht.split .hlab.r0.rl{border-radius:var(--r)}
.ht.split .pc.r0{border-top:var(--lw) solid var(--line)}
.ht.split .pc.r0.cf{border-top-left-radius:var(--r)}
.ht.split .pc.r0.cl{border-top-right-radius:var(--r)}
/* marks: 일정 = dot */
.pdot.e{width:7px;height:7px;border:0;border-radius:50%;background:var(--ink);margin:0 3px}
.pm.done .pdot.e{background:var(--ink)}
.ht.v2 .pdot.e{width:7px;height:7px;left:calc(20px + var(--j)*16px - 3.5px);margin:0}
.pm.ev.done .pt{color:var(--mute);text-decoration:line-through}
/* 연 · 월: tiny dots on the road line, one under another */
.ldots{position:absolute;left:20px;top:0;bottom:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;z-index:2;pointer-events:none}
.ldots i{width:4px;height:4px;border-radius:50%;background:#7d7d7d;pointer-events:auto}
.ldots i.done{background:#c9c9c9}
.ht.v1 .ldots{left:6px}
/* the dots run down the road line below the named things, never on top of them */
.pin>.ldots{position:static;transform:none;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:3px;padding:2px 0;margin-left:calc(20px - (26px + var(--n)*16px) - 2px)}
.ht.v1 .pin>.ldots{margin-left:-4px}

/* ===== round 18 ===== */
.hbody.b2{grid-template-rows:auto;margin-top:6px}
.hbody.b2 .htable{grid-row:1}
.hstackw{grid-column:2;grid-row:1;position:sticky;top:0;align-self:start}
.hstackw .whs{height:22px;display:flex;align-items:flex-end;gap:7px;padding:0 0 4px 2px;font-size:12px}
.hstackw .hstack{position:static;max-height:calc(100vh - 170px)}
.ht.split .hh{position:static}
.ht.split .hh.corner{font-size:11px;color:var(--sub);padding:0 0 4px 2px;white-space:nowrap;letter-spacing:.02em}
.ht.split .pc:not(.cf){border-left:0;box-shadow:inset .5px 0 0 var(--hair)}
/* 루틴 on the 할일 page: the same square */
.pdot.r,.pdot.r.rk-rsq,.pdot.r.rk-dot{border-radius:2px}
.pdot.r.rk-dot::after{display:none}
/* 연 · 월: a tiny dot on the road line, in its date order */
.ldot{position:relative;height:7px}
.ldot i{position:absolute;top:1.5px;left:calc(20px - (26px + var(--n)*16px) - 2px);width:4px;height:4px;border-radius:50%;background:#7d7d7d}
.ldot.done i{background:#c9c9c9}
.ht.v1 .ldot i{left:-4px}
/* the small calendar: 끝 없음 switch, ✕ to close */
.qch .x{margin-left:4px;font-size:12px}
.qch b{margin-right:auto;margin-left:6px}
.qch{justify-content:flex-start}
.qcf .sw{display:flex;align-items:center;gap:6px;border:0;padding:0;color:#666}
.qcf .sw i{position:relative;width:28px;height:16px;border-radius:999px;background:#ddd;transition:background .2s}
.qcf .sw i::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--paper);transition:transform .2s}
.qcf .sw.on{color:var(--ink)}
.qcf .sw.on i{background:var(--ink)}
.qcf .sw.on i::after{transform:translateX(12px)}
.qcd.on{box-shadow:inset 0 -2px 0 #bdbdbd;border-radius:0}

/* ===== round 19 ===== */
/* rows filed under a 할일 wear that 할일's own colour */
#app.hl-hc .board .it.k-hg,#app.hl-hc .pwk .it.k-hg{border-radius:2px;margin:1px -3px;padding:0 3px;background:var(--hc)}
.sw4{position:relative;flex:none;width:30px;height:17px;border-radius:999px;background:#ddd;transition:background .2s}
.sw4 i{position:absolute;left:2px;top:2px;width:13px;height:13px;border-radius:50%;background:var(--paper);transition:transform .2s}
.sw4.on{background:var(--ink)}
.sw4.on i{transform:translateX(13px)}
.hltx{font-size:12.5px}
.hltx small{color:var(--mute);font-size:11px}
/* the small calendar: always on screen; 끝 없음 switch and 완료 side by side */
.qcal{position:fixed;width:256px}
.qcf{flex-direction:column;align-items:stretch;gap:7px}
.qcf .hint{margin:0;font-size:11px;color:#999}
.qcb{display:flex;align-items:center;justify-content:space-between;gap:8px}
.qcf .sw{display:flex;flex-direction:row;align-items:center;gap:7px;white-space:nowrap;flex:none;border:0;padding:0;font-size:12px;color:#777}
.qcf .sw i{flex:none;display:block}
.qcf .sw span{display:inline}
.qcf .ok{margin-left:auto;font-size:12px;padding:4px 14px;border-radius:999px;background:var(--ink);color:var(--paper);border:0}
/* while a row stretches open */
.ht.split .pc.xr0,.ht.split .hlab.xr0{border-top:var(--lw) solid var(--line)!important}
.ht.split .pc.xrl,.ht.split .hlab.xrl{border-bottom:var(--lw) solid var(--line)!important}
.qcal{position:absolute}

/* ===== round 20 ===== */
/* the bar: 세부 chips just under it on the left, 취소 / 완료 under it on the right, a question above it when needed */
.qunder{position:absolute;left:10px;right:0;top:calc(100% + 6px);display:flex;align-items:flex-start;justify-content:space-between;gap:10px;pointer-events:none}
.qsubs,.qact{pointer-events:auto}
.qsubs{display:flex;flex-wrap:wrap;gap:4px;max-width:70%;background:var(--paper);border:var(--lw) solid var(--soft);border-radius:14px;padding:5px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.qsubs.need{border-color:var(--ink);animation:shake .3s}
.qact{display:flex;gap:5px;flex:none}
.qact button{font-size:12px;padding:5px 13px;border-radius:999px;background:var(--paper);border:var(--lw) solid var(--soft);color:#666;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.qact button.ok{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.qask{position:absolute;left:8px;right:8px;bottom:calc(100% + 8px);display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--ink);color:var(--paper);font-size:12.5px;padding:8px 10px 8px 14px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:qpin .16s var(--ease)}
.qask button{font-size:12px;padding:3px 10px;border-radius:999px;border:var(--lw) solid #555;color:#ddd;margin-left:auto}
.qask button+button{margin-left:0}
.qask button.ok{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.qc.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
/* the edit sheet: same pieces, more room */
.qc.cal.big{font-size:13px;padding:6px 12px;gap:7px}
.qc.cal.big small{color:#999;font-size:11px;margin-left:4px}
.qc.cal.big.on small{color:#ccc}
.ecal{padding:4px 18px 10px}
.ecal .qcal{position:static;width:100%;max-width:300px;box-shadow:none;border-color:var(--soft)}
/* 할일: 이정표 a little bigger; names never run into each other */
.pdot.c,.ht.v2 .pdot.c{width:20px;height:20px}
.ht.v2 .pdot.c{left:calc(20px + var(--j)*16px - 10px)}
.ht.split .hh{min-width:0;overflow:hidden;white-space:nowrap;text-align:left;font:inherit;font-size:12px;cursor:pointer}
.ht.split .hh .nm{min-width:0;overflow:hidden;text-overflow:ellipsis}
.ht.split .hh.cat{display:flex;gap:6px;align-items:flex-end}
.ht.split .hh.cat .ring{flex:none}
.ht.split .hh:hover .nm{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--faint)}
.hchip{min-width:0;white-space:nowrap}
.pm .pt{min-width:0}
/* columns that leave slide away sideways */
.ht [data-col]{transition:transform .3s var(--ease),opacity .25s ease}
.ht .slideout{opacity:0;transform:translateX(36px)}

/* ===== round 21 ===== */
.ht .slideL{opacity:0;transform:translateX(-40px)}
.ht .slideR{opacity:0;transform:translateX(40px)}
#ed{position:relative}
#edcal #qcal{position:fixed;z-index:30;width:256px;animation:qpin .16s var(--ease)}
#ed #rsub>div>.row{border-top-color:transparent;padding-top:0}
#ed #rcat>div>.row{padding-bottom:6px}

/* 할일 table: near the road line = make something (+ by the line); far out = open that month / week / day */
.ht .pcplus{left:calc(26px + var(--n)*16px);right:auto;top:50%;font-size:14px;color:#bbb}
.ht.v1 .pcplus{left:12px}
.ht .pc:hover .pcplus{opacity:1}
.ht .pc.far{cursor:zoom-in}
.ht .pc.far .pcplus{opacity:0}
.ht .pc:not(.far){cursor:copy}
.ht .pc:not(.none) .pcplus{display:none}

/* no lines between 세부할일 columns inside a 할일 box */
.ht.split .pc:not(.cf){box-shadow:none;border-left:0}

/* ===== round 22 ===== */
.cpick{position:relative;width:22px;height:22px;border-radius:50%;border:var(--lw) dashed #bbb;display:inline-flex;align-items:center;justify-content:center;color:#999;font-size:13px;cursor:pointer;overflow:hidden;background:var(--c,transparent)}
.cpick.on{border:2px solid var(--paper);box-shadow:0 0 0 1.5px var(--ink);color:transparent}
.cpick.sm{width:24px;height:24px;border-radius:5px}
.cpick input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;border:0;padding:0}
.hlrow .sw3,.cpick.sm{width:21px;height:21px}
.hlrow{gap:5px}
.ydot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:auto}
/* year page: little dots under a date */
.mgrid span{flex-direction:column;position:relative}
.mgrid span .yd{position:absolute;left:50%;bottom:-3px;transform:translateX(-50%);display:flex;gap:1.5px;font-style:normal}
.mgrid span .yd i{width:4px;height:4px;border-radius:50%}

         small daily steps run from the day after the previous milestone up to its due day; sdone['iso|msid']
   stack.all [{id,text,done,cat?,sub?}] = 쌓아두기 (not yet scheduled)

  if (e.key!==KEY || !e.newValue) return;
  try { const s = JSON.parse(e.newValue); if (isData(s)){ S = s; ensure(); if (!st.ed && !st.qp) render(); } } catch(err) {}
});
function L(coll, key){ S[coll] ||= {}; return (S[coll][key] ||= []); }
function cats(){ return S.cats; }
function catById(id){ return S.cats.find(c => c.id===id); }
const catOf = id => catById(id) || catById('base');
const userCats = () => S.cats.filter(c => c.id!=='base');
const rById = id => S.routines.find(r => r.id===id);
const rOn = k => { const w = dowOf(pIso(k)); return S.routines.filter(r => r.dows.includes(w) && r.start<=k && (!r.end || k<r.end) && !S.rskip?.[`${k}|${r.id}`]); };
const rDone = (k,rid) => !!S.rdone[`${k}|${rid}`];
const subById = id => S.subs.find(s => s.id===id);
const subsOf = cid => S.subs.filter(s => s.cat===cid);
const allSubs = () => userCats().flatMap(c => subsOf(c.id));
const msOf = sid => S.ms.filter(m => m.sub===sid).sort((a,b) => (a.due||'~').localeCompare(b.due||'~'));
const msById = id => S.ms.find(m => m.id===id);
// a milestone runs from its own start (if one was set) or from the day after the previous one / the day it was made —
// never past its own due day, so a milestone moved earlier can't run backwards and push its neighbours onto a second line
function msStart(m){
  const cap = k => m.due && k > m.due ? m.due : k;
  if (m.start) return cap(m.start);
  const list = msOf(m.sub), i = list.indexOf(m), prev = list.slice(0,i).reverse().find(x => x.due && x.due!==OPEN);   // one with no end never "comes before"
  return cap(prev && isoAdd(prev.due,1) > m.created ? isoAdd(prev.due,1) : m.created);
}
function stepDays(m){ const out = []; if (!m.due) return out; let k = msStart(m);
  for (let i=0; k<=m.due && i<400; i++, k = isoAdd(k,1)) if (m.dows.includes(dowOf(pIso(k)))) out.push(k); return out; }
const stepsOn = k => S.ms.filter(m => m.due && k<=m.due && k>=msStart(m) && m.dows.includes(dowOf(pIso(k))) && subById(m.sub) && !S.sskip?.[`${k}|${m.id}`]);
const msDueOn = k => [];   // a routine's last day is just another day of it
const sDone = (k,id) => !!S.sdone[`${k}|${id}`];
function progSub(sid){ // what's been done under this 세부할일: its 할일 on the calendar (일반 · 이정표), its weekly goals and its 할일 루틴 — not what's still in the 보관함
  const a = [...Object.values(S.days).flat().filter(i => i.sub===sid && i.type!=='event'), ...Object.values(S.weeks).flat().filter(i => i.sub===sid)];   // routines don't count
  return {done:a.filter(x=>x.done).length, all:a.length}; }
function progCat(cid){ return subsOf(cid).map(s => progSub(s.id)).reduce((a,b) => ({done:a.done+b.done, all:a.all+b.all}), {done:0, all:0}); }
const pct = p => p.all ? Math.round(p.done/p.all*100) : 0;
const catLabel = c => c?.emoji || graphemes(c?.name||'?')[0] || '?';
function setCS(o, cat, sub){
  if (cat && cat!=='base' && catById(cat)) o.cat = cat; else delete o.cat;
  if (sub && subById(sub) && subById(sub).cat===o.cat) o.sub = sub; else delete o.sub;
}
function seed(){
  const d = n => iso(addDays(today,n)), mon = iso(mondayOf(today)), first = mk(today.getFullYear(), today.getMonth())+'-01';
  const it = (text,type='todo',done=false,cat) => ({id:uid(),text,type,done,...(cat?{cat}:{})});
  const s = {
    set:{ver:1, pmv:1},
    cats:[{id:'base',name:'기본',color:null},{id:'c1',name:'공부',color:'#4a78c8',emoji:'📘'},{id:'c2',name:'집안일',color:'#d0893f',emoji:'🧺'}],
    days:{
      [d(-3)]:[it('가족 모임','event',true),it('빨래','todo',true,'c2')],
      [d(-2)]:[it('팀 회의','event',true),it('메일 답장','todo',true)],
      [d(-1)]:[it('보고서 작성','todo',true,'c1'),it('서류 제출')],
      [d(0)]:[it('스터디','event'),it('병원 예약','event'),it('과제 제출','todo',false,'c1'),it('장보기','todo',true,'c2'),it('약 먹기 (점심 먹고)')],
      [d(1)]:[it('면접','event')],
      [d(3)]:[it('발표 준비','todo',false,'c1')]
    },
    goals:{}, weeks:{[mon]:[{id:uid(),text:'방 청소',done:true}]}, wkSeed:true,
    routines:[{id:'r1',text:'아침 스트레칭',dows:[0,1,2,3,4,5,6],start:first},{id:'r2',text:'물 2L 마시기',dows:[0,2,4],start:first}],
    rdone:{}
  };
  for (let i=1;i<=5;i++) s.rdone[`${d(-i)}|r1`] = true;
  return s;
}

/* ---------- view state ---------- */
const st = { view:'month', hal:false, y:today.getFullYear(), m:today.getMonth(), wk:mondayOf(today), sel:dowOf(today),
  portrait:false, pm:'cal', qtype:'todo', qcat:null, qsub:null, ed:null, setOpen:false, refocus:null, anim:null, busy:false,
  hcat:'all', hsub:'all', htype:'todo', qp:null, padd:null, dslide:null, wadd:null, knob:null, slide:null, lastView:null, dirty:false };
const VIDX = {year:0, month:1, week:2};

/* ---------- markers: 일정 = dot (done → only struck through), 할일 = empty box, 루틴 = ↻ box, 이정표 = circle ---------- */
function mark(kind, done, extra=''){
  const c = `ck ${kind}${done?' done':''}${extra?' '+extra:''}`;
  return kind==='rt' ? `<span class="${c} rk-${S.set.rmk}"><i></i></span>` : `<span class="${c}"><i></i></span>`;
}
const KIND = {event:'ev', todo:'td', routine:'rt', ms:'rt', bl:'td'};
function ring(p, size, color, inner, stroke=3){
  const r = (size - stroke)/2, c = 2*Math.PI*r;
  return `<span class="ring" style="width:${size}px;height:${size}px;font-size:${size}px"><svg viewBox="0 0 ${size} ${size}" aria-hidden="true">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="#e8e8e8" stroke-width="${stroke}"/>
    ${p>0?`<circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${color||'#141414'}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${(c*p/100).toFixed(2)} ${c.toFixed(2)}"/>`:''}</svg><span class="rin">${inner}</span></span>`;
}
const arrow = dir => `<svg viewBox="0 0 6 8" aria-hidden="true"><path d="${dir<0?'M6 0V8L0 4Z':'M0 0V8L6 4Z'}"/></svg>`;
const roadSvg = `<svg viewBox="0 0 20 20" fill="none" stroke="#141414" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 18.2V2.6"/><path d="M5.5 3.4h9.8l-2.3 3.2 2.3 3.2H5.5"/></svg>`;   // 할일 page: one flag
const calSvg = () => `<svg viewBox="0 0 20 20" fill="none" stroke="#141414" stroke-width="1.1" stroke-linecap="round"><rect x="2.5" y="3.8" width="15" height="13.7" rx="2"/><path d="M2.5 7.4h15M6.5 2.3v3M13.5 2.3v3"/></svg>`;   // planner: a plain, empty calendar
const foldBtn = `<button class="fbtn" data-act="goMonth" aria-label="월간으로 접기"><svg viewBox="0 0 9 7"><path d="M0 0h9L4.5 7z"/></svg></button>`;
function gearSvg(){
  let t = '';
  for (let i=0;i<8;i++){ const a = i*Math.PI/4, c = Math.cos(a), s = Math.sin(a);
    t += `<line x1="${(10+5.6*c).toFixed(2)}" y1="${(10+5.6*s).toFixed(2)}" x2="${(10+8*c).toFixed(2)}" y2="${(10+8*s).toFixed(2)}"/>`; }
  return `<svg viewBox="0 0 20 20" fill="none" stroke="#141414"><g stroke-width="2.6">${t}</g><circle cx="10" cy="10" r="5.6" stroke-width="1.1"/><circle cx="10" cy="10" r="2.2" stroke-width="1.1"/></svg>`;
}

/* ---------- one row ---------- */
function itemRow(ref, kind, done, text, {tag='', drag=false, cls='', hc=null} = {}){
  return `<div class="it${cls?' '+cls:''}${hc?' k-hg':''}${done?' done':''}" data-ref="${ref}"${drag?' data-drag':''}${hc?` style="--hc:${hc}"`:''}>${mark(kind,done)}<span class="tx">${esc(text)}</span>${tag}</div>`;
}
const tagOf = (cat, sub) => sub && subById(sub) ? `<span class="tag">${esc(subById(sub).name)}</span>`
  : cat && cat!=='base' && catById(cat) ? `<span class="tag">${esc(catById(cat).name)}</span>` : '';
const hcOf = i => { const c = catById(i?.cat) || catById(subById(i?.sub)?.cat); return c && c.id!=='base' && c.color ? c.color + '30' : null; };   // a 할일's own colour, light
const kOf = (i, base) => base;   // (old: filed under a 할일 → the 할일 colour
const tdRow = (k, i) => itemRow(`days|${k}|${i.id}`, 'td', i.done, i.text, {drag:true, cls:'k-td', hc:hcOf(i)});
const evRow = (k, i) => itemRow(`days|${k}|${i.id}`, 'ev', i.done, i.text, {drag:true, cls:'k-ev', hc:hcOf(i)});
const rtRow = (k, x) => itemRow(`rt|${k}|${x.r.id}`, 'rt', x.done, x.r.text, {cls:'rtn k-rt'});
const msRow = (m, tag) => itemRow(`ms||${m.id}`, 'td', m.done, m.text, {drag:true, cls:'msi k-td', hc:hcOf(m), tag: tag ? tagOf(null, m.sub) : ''});
const stRow = (k, x) => itemRow(`ss|${k}|${x.m.id}`, 'td', x.done, x.m.text, {cls:'step k-td', hc:hcOf(x.m)});

/* ---------- one day ---------- */
function dayData(k){
  const items = L('days',k);
  return {ev: items.filter(i => i.type==='event'), td: items.filter(i => i.type!=='event'),
    rts: rOn(k).map(r => ({r, done:rDone(k,r.id)})), due: msDueOn(k), steps: stepsOn(k).map(m => ({m, done:sDone(k,m.id)}))};
}
// week page: 일정 · 루틴 · 할일 · each 할일, split by very light labelled lines; each 세부할일 sits in a hairline box
const lab = t => `<div class="gh"><span>${t}</span><i></i></div>`;
function dayList(k){ // week page: 일정 · 루틴 · 할일 · each 할일 and its 세부할일, in that order — no lines, no boxes
  const {ev, td, rts, due, steps} = dayData(k);
  let h = ev.map(i => evRow(k,i)).join('') + rts.map(x => rtRow(k,x)).join('') + td.filter(i => !i.cat || !catById(i.cat)).map(i => tdRow(k,i)).join('');
  userCats().forEach(c => {
    const ci = td.filter(i => i.cat===c.id);
    h += ci.filter(i => !i.sub || !subById(i.sub)).map(i => tdRow(k,i)).join('');
    subsOf(c.id).forEach(s => { h += due.filter(m => m.sub===s.id).map(m => msRow(m)).join('') + ci.filter(i => i.sub===s.id).map(i => tdRow(k,i)).join('') + steps.filter(x => x.m.sub===s.id).map(x => stRow(k,x)).join(''); });
  });
  return `<div class="dlist">${h}</div>`;
}
// month cell: when it doesn't fit, fold routines, then to-dos, then events — but only a group of two or more
function cellHTML(k, lvl=0){
  const {ev, td, rts, due, steps} = dayData(k);
  const sum = (kind, label, txt) => `<div class="it sum" data-act="goDay" data-iso="${k}">${mark(kind,false,'def')}<span class="tx">${label} ${txt}</span></div>`;
  let h = lvl>=3 && ev.length>1 ? sum('ev','일정',ev.length) : ev.map(i => evRow(k,i)).join('');
  h += lvl>=1 && rts.length>1 ? sum('rt','루틴',`${rts.filter(x=>x.done).length}/${rts.length}`) : rts.map(x => rtRow(k,x)).join('');
  const n = due.length + td.length + steps.length, dn = due.filter(m=>m.done).length + td.filter(i=>i.done).length + steps.filter(x=>x.done).length;
  h += lvl>=2 && n>1 ? sum('td','할일',`${dn}/${n}`) : due.map(m => msRow(m)).join('') + td.map(i => tdRow(k,i)).join('') + steps.map(x => stRow(k,x)).join('');
  return `<div class="dlist">${h}${PLUS(`days|${k}`)}</div>`;
}
function fitCells(){
  if (S.set.sum===2) return syncRows();
  app.querySelectorAll('.month .cb[data-iso]').forEach(b => {
    if (b.closest('.cell.out')) return;
    const k = b.dataset.iso;
    for (let lvl=0; lvl<=3; lvl++){ b.innerHTML = cellHTML(k, lvl); if (b.scrollHeight <= b.clientHeight + 1) return; }
  });
  app.querySelectorAll('.month .wrow[data-w]').forEach(r => { // weekly goals fold the same way
    const w = r.dataset.w, l = r.querySelector('.wlist');
    for (let lvl=0; lvl<=2; lvl++){ l.innerHTML = weekContent(w, lvl, true); if (l.scrollHeight <= l.clientHeight + 1) return; }
  });
}
// 요약 끄기: every row grows to show everything; calendar rows and weekly rows keep the same height
function syncRows(){
  const cal = app.querySelector('.month .cal'), wk = app.querySelector('.month .wkbox'); if (!cal) return;
  app.querySelectorAll('.month .cb[data-iso]').forEach(b => { if (!b.closest('.cell.out')) b.innerHTML = cellHTML(b.dataset.iso, 0); });
  app.querySelectorAll('.month .wrow[data-w]').forEach(r => { r.querySelector('.wlist').innerHTML = weekContent(r.dataset.w, 0, true); });
  const n = +cal.dataset.rows, auto = Array(n).fill('auto').join(' ');
  [cal, wk].forEach(el => { if (el) el.style.transition = 'none'; });   // measuring must not play the unfold animation
  cal.style.gridTemplateRows = auto; if (wk) wk.style.gridTemplateRows = auto;
  const cells = [...cal.children], rows = [...(wk?.children || [])];
  const hs = Array.from({length:n}, (_,i) => Math.max(st.portrait ? 64 : 96, ...cells.slice(i*7, i*7+7).map(c => c.offsetHeight), rows[i] ? rows[i].offsetHeight : 0));
  const t = hs.map(h => h + 'px').join(' ');
  cal.style.gridTemplateRows = t; if (wk) wk.style.gridTemplateRows = t;
  void cal.offsetHeight; requestAnimationFrame(() => [cal, wk].forEach(el => { if (el) el.style.transition = ''; }));
}
function sizeCal(){ // tall screens: the month (and the unfolded week) fill the screen, cells never shorter than wide
  if (!st.portrait || st.hal || (S.set.sum===2 && st.view==='month')) return;
  const el = app.querySelector('.board .cal, .board .days'); if (!el) return;
  el.style.height = '';
  const main = app.querySelector('main'), board = app.querySelector('.board'), rows = monthGrid(st.y, st.m).length;
  const room = Math.floor(main.getBoundingClientRect().bottom - el.getBoundingClientRect().top - (st.view==='month' ? 26 : 14));
  const h = Math.max(Math.ceil(board.clientWidth * rows / 7) + 2, room);
  el.style.height = h + 'px';
  const wb = app.querySelector('.board .wkbox'); if (wb) wb.style.height = h + 'px';
  main.classList.toggle('pager', st.view==='month' && h <= room + 2);
}
const layout = () => { if (!st.hal && (st.view==='month' || st.view==='week')){ sizeCal(); if (st.view==='month') fitCells(); } };
const weekTitle = () => `${st.y}<span class="dim">·</span>${st.m+1}<span class="dim">·</span>week ${weekIndex()+1}`;
function weekIndex(){ const i = monthGrid(st.y, st.m).findIndex(w => iso(w[0])===iso(st.wk)); return i<0 ? 0 : i; }

/* ---------- header ---------- */
function header(){
  const v = st.view, i = VIDX[v], from = st.knob ?? i;
  const seg = [['year','연'],['month','월'],['week','주']].map(([k,l]) => `<button class="${v===k?'on':''}" data-act="view" data-v="${k}">${l}</button>`).join('');
  // the title always holds year · month · week; parts slide open/shut as the view changes (starting from the last view)
  const ttl = `<button class="ts y" data-act="view" data-v="year" title="연">${st.y}</button><span class="ts m${from<1?' off':''}"><button class="tv" data-act="view" data-v="month" title="월">${st.m+1}</button></span><span class="ts w${from<2?' off':''}"><b class="tv">week${weekIndex()+1}</b></span>`;
  return `<header><div class="hl"><button class="arr" data-act="prev" aria-label="이전">${arrow(-1)}</button><span class="ptl">${ttl}</span><button class="arr" data-act="next" aria-label="다음">${arrow(1)}</button></div>
    <div class="pill" role="tablist"><span class="knob" style="transform:translateX(${from*100}%)" data-to="${i}"></span>${seg}</div>
    <div class="hr"><button class="ib${st.hal?' on':''}" data-act="hal" title="할일" aria-label="할일 페이지">${roadSvg}</button>
      <button class="ib" data-act="today" title="오늘 (${today.getMonth()+1}월)" aria-label="오늘의 월 페이지">${calSvg()}</button>
      <button class="ib" data-act="settings" title="설정" aria-label="설정">${gearSvg()}</button></div></header>`;
}

/* ---------- year: twelve calendars, nothing else ---------- */
function yearView(){
  return `<div class="year"><div class="months">` + Array.from({length:12}, (_,m) => {
    const first = new Date(st.y,m,1), n = new Date(st.y,m+1,0).getDate();
    let cells = '';
    for (let i=0;i<dowOf(first);i++) cells += '<span></span>';
    for (let d=1; d<=n; d++){ const k = iso(new Date(st.y,m,d)), dots = yearDots(k);
      cells += `<span${k===TODAY?' class="td"':''}>${d}${dots ? `<em class="yd">${dots}</em>` : ''}</span>`; }
    return `<div class="mm" data-act="goMonthOf" data-m="${m}"><div class="t">${m+1}</div><div class="mface"><div class="mgrid">${cells}</div></div></div>`;
  }).join('') + `</div></div>`;
}

// 설정 → 연 페이지에 표시: up to three small dots under a date, each in its colour
function yearDots(k){
  const y = S.set.ys || {}; if (!Object.values(y).some(Boolean)) return '';
  const out = [], items = S.days[k] || [];
  const add = (c, t) => { if (out.length < 3 && !out.some(o => o.c===c)) out.push({c, t}); };
  items.forEach(i => {   // 일정 · 할일 (이정표 counts as a 할일) · 루틴 — by kind only
    if (i.type==='event' && y.event) add(ydotColor('event'), i.text);
    else if (i.type!=='event' && y.todo) add(ydotColor('todo'), i.text); });
  if (y.routine && rOn(k).length) add(ydotColor('routine'), '루틴');
  if (y.routine) stepsOn(k).forEach(m => add(ydotColor('routine'), m.text));
  return out.map(o => `<i style="background:${o.c}" title="${esc(o.t)}"></i>`).join('');
}

/* ---------- weekly goals: this week's milestones + what was added here. Same square marks, same type, no name tags on the month page ---------- */
function weekContent(mon, lvl=0, inMonth=false){
  const ms = []; for (let i=0;i<7;i++){ const k = isoAdd(mon,i); L('days',k).forEach(it => { if (it.star && it.type!=='event') ms.push({k, it, done:it.done}); }); }
  const items = L('weeks', mon), sum = (label, l) => `<div class="it sum">${mark('td',false,'def')}<span class="tx">${label} ${l.filter(x=>x.done).length}/${l.length}</span></div>`;
  let h = lvl>=1 && ms.length>1 ? sum('이정표', ms) : ms.map(({k, it}) => itemRow(`days|${k}|${it.id}`, 'td', it.done, it.text, {drag:true, cls:'k-td', hc:hcOf(it)})).join('');
  h += lvl>=2 && items.length>1 ? sum('목표', items) : items.map(i => itemRow(`weeks|${mon}|${i.id}`, 'td', i.done, i.text, {drag:true, cls:'k-td', hc:hcOf(i)})).join('');
  return h + PLUS(`weeks|${mon}`, '주간 목표 추가');
}

/* ---------- month ---------- */
function monthView(){
  const g = monthGrid(st.y, st.m), rows = Array(g.length).fill('1fr').join(' '), nowMon = iso(mondayOf(today));
  let cells = '';
  g.forEach((w,wi) => w.forEach(d => {
    const last = wi===g.length-1 ? ' last' : '', k = iso(d), out = d.getMonth()!==st.m;
    cells += `<div class="cell${out?' out':''}${k===TODAY?' today':''}${last}" data-iso="${k}" data-act="goDay"${out?'':` data-drop="days|${k}"`}>
      <span class="d">${out?'':d.getDate()}</span><div class="cb" data-iso="${k}"></div></div>`;
  }));
  const wrows = g.map((w,i) => { const k = iso(w[0]);
    return `<div class="wrow${k===nowMon?' now':''}" data-act="goWeek" data-w="${k}" data-drop="weeks|${k}"><div class="wl">week ${i+1}</div><div class="wlist">${weekContent(k, 0, true)}</div></div>`; }).join('');
  const v2 = st.portrait, goal = v2 && st.pm==='goal';
  return (v2 ? pmSwitch() : '') + `<div class="board month${v2?' v2':''}${goal?' pgoal':''}${S.set.sum===2?' full':''}"><div class="dow">${DOW.map(s => `<span class="dw">${s}</span>`).join('')}</div>
    <div class="wh"><span>WEEKLY</span></div>
    <div class="cal" data-rows="${g.length}" style="grid-template-rows:${rows}">${cells}</div>
    <div class="wkbox" style="grid-template-rows:${rows}">${wrows}</div></div>`
    + (st.portrait ? `<div class="pagehint">위아래로 넘겨 다른 달로 · 옆으로 넘겨 달력/주간목표</div>` : '');
}

/* ---------- week (tall screens: the box holds only the chosen day; 달력 ⇄ 주간목표 like the month) ---------- */

/* going down a level: the chosen month / week stretches open, the rest folds away */
// changing 연 ⇄ 월 ⇄ 주: the box grows to its new size while each thing glides to where it now belongs
// things glide from where they were to where they now are (FLIP). Only the outermost marked element moves,
// so a circle never gets moved twice (once with its row, once on its own)
const flipEls = root => [...root.querySelectorAll('[data-ref], [data-fk]')].filter(el => !el.parentElement.closest('[data-ref], [data-fk]') || el.dataset.fk);
const flipKey = el => el.dataset.fk || el.dataset.ref;
function snapHal(){
  const tbl = app.querySelector('.htable'), at = {}; if (!tbl) return {at};
  flipEls(tbl).forEach(el => { const k = flipKey(el); if (!at[k]) at[k] = el.getBoundingClientRect(); });
  return {at, box: tbl.getBoundingClientRect()};
}
function flipFrom(before, ms=480){
  const tbl = app.querySelector('.htable'); if (!tbl) return;
  const box0 = before.box, box1 = tbl.getBoundingClientRect(), ease = 'cubic-bezier(.3,.1,.2,1)';
  if (box0) tbl.animate([{height:box0.height+'px', overflow:'hidden'}, {height:box1.height+'px', overflow:'hidden'}], {duration:ms, easing:ease});
  const seen = new Set();
  flipEls(tbl).forEach(el => { const k = flipKey(el), o = before.at[k], n = el.getBoundingClientRect();
    if (o && !seen.has(k)){ seen.add(k); const dx = o.left-n.left, dy = o.top-n.top; if (Math.abs(dx) + Math.abs(dy) > .5) el.animate([{transform:`translate(${dx}px,${dy}px)`}, {transform:'translate(0,0)'}], {duration:ms, easing:ease}); }
    else if (!el.dataset.fk) el.animate([{opacity:0}, {opacity:1}], {duration:300, delay:ms*.45, easing:'ease', fill:'backwards'}); });
  tbl.querySelectorAll('.ln, .ldot, .pst').forEach(el => el.animate([{opacity:0}, {opacity:1}], {duration:280, delay:ms*.5, fill:'backwards'}));   // road lines settle in after the move
}
function halGo(keep, apply){
  if (reduced || st.busy){ apply(); render(); return; }
  const before = snapHal(); apply(); render(); flipFrom(before);
}
// narrowing (전체 → a 할일, → a 세부할일): what is left of the chosen one leaves to the left, what is right of it leaves to the right,
// then the chosen one slides to the far left and widens
function halNarrow(keepCol, apply){
  const cells = [...app.querySelectorAll('.ht [data-col]')];
  const kept = cells.filter(c => keepCol(c.dataset.col)), going = cells.filter(c => !keepCol(c.dataset.col));
  if (reduced || st.busy || !going.length || !kept.length){ apply(); render(); return; }
  st.busy = true;
  const x0 = Math.min(...kept.map(c => c.getBoundingClientRect().left));
  going.forEach(c => c.classList.add(c.getBoundingClientRect().left < x0 ? 'slideL' : 'slideR'));
  setTimeout(() => { st.busy = false; const before = snapHal(); apply(); render(); flipFrom(before, 420); }, 260);
}

const YDEF = {event:'#4a78c8', todo:'#c4a23a', star:'#141414', routine:'#9b9b9b', hal:'#5a9e6f'};

/* ---------- editor state ---------- */
function newPlan(date){ const rt = st.qtype==='routine'; st.ed = {mode:'plan', type:st.qtype, date: rt ? '' : date, start:date, text:'', memo:'', cat:st.qcat, sub:st.qsub, dows:[0,1,2,3,4,5,6]}; render(); }
function newHal(type, preset={}){
  const sub = st.hsub!=='all' ? st.hsub : null, cat = sub ? subById(sub).cat : st.hcat!=='all' ? st.hcat : null;
  st.ed = {mode:'hal', type, place:'plan', date:isoAdd(TODAY,14), text:'', cat, sub, dows:[0,2,4], ...preset};

function warn(id){ const r = app.querySelector('#'+id); if (!r) return; r.classList.add('warn'); setTimeout(() => r.classList.remove('warn'), 900); }
function removeRef(ref){ const [c,,id] = ref.split('|'); if (c==='ms'){ const m = msById(id); S.ms = S.ms.filter(x => x!==m); return m; } return takeItem(ref); }
function quickAdd(input){
  const text = input.value.trim(); if (!text) return false;

    if (st.qtype==='routine') S.routines.push({id:uid(), text, dows:[0,1,2,3,4,5,6], start:key});

  }

  else if (coll==='stack'){ const o = {id:uid(), text, done:false, kind:st.htype}; setCS(o, key, x); if (st.htype==='ms') o.dows = [0,2,4]; L('stack','all').push(o); }

  save();

/* ---------- render ---------- */
