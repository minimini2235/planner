.ht.split .pc.rl{border-bottom:var(--lw) solid var(--line)}
.ht.split .pc.rl.cf{border-bottom-left-radius:var(--r)}
.ht.split .pc.rl.cl{border-bottom-right-radius:var(--r)}
.ht.split.v2 .pc.cf{border-left-color:var(--line)}
.ht.split .pc.cf .ln{margin-left:0}
/* 연 / 월: everything except ★ is just a small dot */
.dots{display:flex;flex-wrap:wrap;gap:4px;padding:2px 0 0 2px}
.mdot{width:6px;height:6px;border-radius:50%;background:color-mix(in srgb,var(--ink) 43.0%,var(--paper))}
.mdot.done{background:color-mix(in srgb,var(--ink) 20.0%,var(--paper))}
.ht.v2 .dots{padding-left:0}
/* the one-row bar: range button + small calendar */
.qc.cal{display:flex;align-items:center;gap:5px}
.qci{width:13px;height:13px}
.qc.more{color:color-mix(in srgb,var(--ink) 43.4%,var(--paper))}
.qcal{position:absolute;right:8px;top:calc(100% + 6px);width:252px;background:var(--paper);border:var(--lw) solid var(--ink);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.14);padding:10px 10px 8px;z-index:2}
.qcal.up{top:auto;bottom:calc(100% + 6px)}
.qcal.warn{animation:shake .3s}
.qcal.warn .hint{color:var(--ink)}
.qch{display:flex;align-items:center;justify-content:space-between;padding:0 2px 6px;font-size:13px}
.qch b{font-weight:400}
.qch button{width:26px;height:24px;border-radius:6px;font-size:15px;color:color-mix(in srgb,var(--ink) 57.9%,var(--paper))}
.qch button:hover{background:var(--hover);color:var(--ink)}
.qcg{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px;text-align:center}
.qcg span{font-size:10px;color:color-mix(in srgb,var(--ink) 36.2%,var(--paper));padding-bottom:3px}
.qcd{height:28px;font-size:12px;font-variant-numeric:tabular-nums;border-radius:6px;position:relative}
.qcd:hover{background:var(--hover)}
.qcd.out{color:color-mix(in srgb,var(--ink) 20.4%,var(--paper))}
.qcd.td{font-weight:500}
.qcd.in,.qcd.s,.qcd.e{box-shadow:inset 0 -2px 0 var(--ink);border-radius:0}
.qcd.s,.qcd.e{background:var(--ink);color:var(--paper);border-radius:6px;box-shadow:none}
.qcd.open:hover{box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--ink) 28.9%,var(--paper))}
.qcf{display:flex;align-items:center;gap:6px;padding-top:8px;font-size:11px;color:color-mix(in srgb,var(--ink) 43.4%,var(--paper))}
.qcf span{margin-right:auto}
.qcf button{font-size:11px;padding:3px 9px;border-radius:999px;border:var(--lw) solid var(--soft);color:color-mix(in srgb,var(--ink) 65.1%,var(--paper))}
.qcf button.ok{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.qpop.bottom .qcal{right:0;left:0;margin:auto}

/* ===== round 17 ===== */
#app.hl-hg .board .it.k-hg,#app.hl-hg .pwk .it.k-hg{border-radius:2px;margin:1px -3px;padding:0 3px;background:color-mix(in srgb,var(--hl-hg) var(--hlmix,100%),transparent)}
/* 할일: names sit above the two boxes, like Mon… above the calendar */
.ht.split .hh{border:0!important;border-radius:0!important;padding:0 10px 4px;align-items:flex-end;font-size:12px}
.ht.split .hh.cat{font-size:11px;color:var(--mute);padding-bottom:2px}
.ht.split .hlab.r0{border-top:var(--lw) solid var(--line);border-radius:var(--r) var(--r) 0 0}
.ht.split .hlab.r0.rl{border-radius:var(--r)}
.ht.split .pc.r0{border-top:var(--lw) solid var(--line)}
.ht.split .pc.r0.cf{border-top-left-radius:var(--r)}
.ht.split .pc.r0.cl{border-top-right-radius:var(--r)}
/* marks: 일정 = dot */
.pdot.e{width:7px;height:7px;border:0;border-radius:50%;background:var(--ink);margin:0 3px}
.pm.done .pdot.e{background:var(--ink)}
.ht.v2 .pdot.e{width:7px;height:7px;left:calc(20px + var(--j)*16px - 3.5px);margin:0}
.pm.ev.done .pt{color:var(--mute);text-decoration:line-through}
/* 연 · 월: tiny dots on the road line, one under another */
.ldots{position:absolute;left:20px;top:0;bottom:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;z-index:2;pointer-events:none}
.ldots i{width:4px;height:4px;border-radius:50%;background:color-mix(in srgb,var(--ink) 55.3%,var(--paper));pointer-events:auto}
.ldots i.done{background:color-mix(in srgb,var(--ink) 23.0%,var(--paper))}
.ht.v1 .ldots{left:6px}
/* the dots run down the road line below the named things, never on top of them */
.pin>.ldots{position:static;transform:none;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:3px;padding:2px 0;margin-left:calc(20px - (26px + var(--n)*16px) - 2px)}
.ht.v1 .pin>.ldots{margin-left:-4px}

/* ===== round 18 ===== */
.hbody.b2{grid-template-rows:auto;margin-top:6px}
.hbody.b2 .htable{grid-row:1}
.hstackw{grid-column:2;grid-row:1;position:sticky;top:0;align-self:start}
.hstackw .whs{height:22px;display:flex;align-items:flex-end;gap:7px;padding:0 0 4px 2px;font-size:12px}
.hstackw .hstack{position:static;max-height:calc(100vh - 170px)}
.ht.split .hh{position:static}
.ht.split .hh.corner{font-size:11px;color:var(--sub);padding:0 0 4px 2px;white-space:nowrap;letter-spacing:.02em}
.ht.split .pc:not(.cf){border-left:0;box-shadow:inset .5px 0 0 var(--hair)}
/* 루틴 on the 할일 page: the same square */
.pdot.r,.pdot.r.rk-rsq,.pdot.r.rk-dot{border-radius:2px}
.pdot.r.rk-dot::after{display:none}
/* 연 · 월: a tiny dot on the road line, in its date order */
.ldot{position:relative;height:7px}
.ldot i{position:absolute;top:1.5px;left:calc(20px - (26px + var(--n)*16px) - 2px);width:4px;height:4px;border-radius:50%;background:color-mix(in srgb,var(--ink) 55.3%,var(--paper))}
.ldot.done i{background:color-mix(in srgb,var(--ink) 23.0%,var(--paper))}
button.ldot{display:block;width:100%;height:11px;cursor:pointer}
button.ldot i{top:3.5px}
button.ldot:hover i{transform:scale(1.6)}
.ht.v1 .ldot i{left:-4px}
/* the small calendar: 끝 없음 switch, ✕ to close */
.qch .x{margin-left:4px;font-size:12px}
.qch b{margin-right:auto;margin-left:6px}
.qch{justify-content:flex-start}
.qcf .sw{display:flex;align-items:center;gap:6px;border:0;padding:0;color:color-mix(in srgb,var(--ink) 65.1%,var(--paper))}
.qcf .sw i{position:relative;width:28px;height:16px;border-radius:999px;background:color-mix(in srgb,var(--ink) 14.5%,var(--paper));transition:background .2s}
.qcf .sw i::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--paper);transition:transform .2s}
.qcf .sw.on{color:var(--ink)}
.qcf .sw.on i{background:var(--ink)}
.qcf .sw.on i::after{transform:translateX(12px)}
.qcd.on{box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--ink) 28.1%,var(--paper));border-radius:0}

/* ===== round 19 ===== */
/* rows filed under a 할일 wear that 할일's own colour */
#app.hl-hc .board .it.k-hg,#app.hl-hc .pwk .it.k-hg{border-radius:2px;margin:1px -3px;padding:0 3px;background:var(--hc)}
.sw4{position:relative;flex:none;width:30px;height:17px;border-radius:999px;background:color-mix(in srgb,var(--ink) 14.5%,var(--paper));transition:background .2s}
.sw4 i{position:absolute;left:2px;top:2px;width:13px;height:13px;border-radius:50%;background:var(--paper);transition:transform .2s}
.sw4.on{background:var(--ink)}
.sw4.on i{transform:translateX(13px)}
.hltx{font-size:12.5px}
.hltx small{color:var(--mute);font-size:11px}
/* the small calendar: always on screen; 끝 없음 switch and 완료 side by side */
.qcal{position:fixed;width:256px}
.qcf{flex-direction:column;align-items:stretch;gap:7px}
.qcf .hint{margin:0;font-size:11px;color:color-mix(in srgb,var(--ink) 43.4%,var(--paper))}
.qcb{display:flex;align-items:center;justify-content:space-between;gap:8px}
.qcf .sw{display:flex;flex-direction:row;align-items:center;gap:7px;white-space:nowrap;flex:none;border:0;padding:0;font-size:12px;color:color-mix(in srgb,var(--ink) 57.9%,var(--paper))}
.qcf .sw i{flex:none;display:block}
.qcf .sw span{display:inline}
.qcf .ok{margin-left:auto;font-size:12px;padding:4px 14px;border-radius:999px;background:var(--ink);color:var(--paper);border:0}
/* while a row stretches open */
.ht.split .pc.xr0,.ht.split .hlab.xr0{border-top:var(--lw) solid var(--line)!important}
.ht.split .pc.xrl,.ht.split .hlab.xrl{border-bottom:var(--lw) solid var(--line)!important}
.qcal{position:absolute}

/* ===== round 20 ===== */
/* the bar: 세부 chips just under it on the left, 취소 / 완료 under it on the right, a question above it when needed */
.qunder{position:absolute;left:10px;right:0;top:calc(100% + 6px);display:flex;align-items:flex-start;justify-content:space-between;gap:10px;pointer-events:none}
.qsubs,.qact{pointer-events:auto}
.qpop.up .qunder{top:auto;bottom:calc(100% + 6px);align-items:flex-end}
.qpop.up .qask{bottom:calc(100% + 54px)}
.qsubs{display:flex;flex-wrap:wrap;gap:4px;max-width:70%;background:var(--paper);border:var(--lw) solid var(--soft);border-radius:14px;padding:5px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.qsubs.need{border-color:var(--ink);animation:shake .3s}
.qact{display:flex;gap:5px;flex:none}
.qact button{font-size:12px;padding:5px 13px;border-radius:999px;background:var(--paper);border:var(--lw) solid var(--soft);color:color-mix(in srgb,var(--ink) 65.1%,var(--paper));box-shadow:0 2px 8px rgba(0,0,0,.06)}
.qact button.ok{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.qask{position:absolute;left:8px;right:8px;bottom:calc(100% + 8px);display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--ink);color:var(--paper);font-size:12.5px;padding:8px 10px 8px 14px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:qpin .16s var(--ease)}
.qask button{font-size:12px;padding:3px 10px;border-radius:999px;border:var(--lw) solid color-mix(in srgb,var(--ink) 72.3%,var(--paper));color:color-mix(in srgb,var(--ink) 14.5%,var(--paper));margin-left:auto}
.qask button+button{margin-left:0}
.qask button.ok{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.qc.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
/* the edit sheet: same pieces, more room */
.qc.cal.big{font-size:13px;padding:6px 12px;gap:7px}
.qc.cal.big small{color:color-mix(in srgb,var(--ink) 43.4%,var(--paper));font-size:11px;margin-left:4px}
.qc.cal.big.on small{color:color-mix(in srgb,var(--ink) 21.7%,var(--paper))}
.ecal{padding:4px 18px 10px}
.ecal .qcal{position:static;width:100%;max-width:300px;box-shadow:none;border-color:var(--soft)}
/* 할일: ★ a little bigger; names never run into each other */
.pdot.c,.ht.v2 .pdot.c{width:20px;height:20px}
.ht.v2 .pdot.c{left:calc(20px + var(--j)*16px - 10px)}
.ht.split .hh{min-width:0;overflow:hidden;white-space:nowrap;text-align:left;font:inherit;font-size:12px;cursor:pointer}
.ht.split .hh .nm{min-width:0;overflow:hidden;text-overflow:ellipsis}
.ht.split .hh.cat{display:flex;gap:6px;align-items:flex-end}
.ht.split .hh.cat .ring{flex:none}
.ht.split .hh:hover .nm{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--faint)}
.hchip.hid{opacity:.45;border-style:dashed}
.hchip.hidt{font-size:12px;color:var(--mute);border-style:dashed}
.hchip.hidt.on{color:var(--ink);border-style:solid}
.hidlist{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:var(--lw) solid var(--soft);border-radius:18px;background:var(--paper);box-shadow:0 8px 24px rgba(0,0,0,.08);max-width:420px;animation:fadein .2s ease}
.hidh{display:flex;align-items:baseline;gap:8px;font-size:13px;font-weight:500;padding:0 2px 6px}
.hidh small{font-size:11px;font-weight:400;color:var(--mute)}
.hidr{display:flex;align-items:center;gap:8px;min-height:38px;padding:0 2px;border-top:var(--hl) solid var(--hair);font-size:13px}
.hidr span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hidr small{font-size:11px;color:var(--mute)}
.hidr button{height:30px;padding:0 14px;border:var(--lw) solid var(--soft);border-radius:999px;font-size:12.5px}
.hidr button:hover{border-color:var(--ink)}
.hchip{min-width:0;white-space:nowrap;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.hchip.chipdrag{transform:scale(1.06);box-shadow:0 6px 18px rgba(0,0,0,.18);background:var(--paper);z-index:3;position:relative;transition:transform .15s}
.pm .pt{min-width:0}
/* columns that leave slide away sideways */
.ht [data-col]{transition:transform .3s var(--ease),opacity .25s ease}
.ht .slideout{opacity:0;transform:translateX(36px)}

/* ===== round 21 ===== */
.ht .slideL{opacity:0;transform:translateX(-40px)}
.ht .slideR{opacity:0;transform:translateX(40px)}
#ed{position:relative}
#edcal #qcal{position:fixed;z-index:30;width:256px;animation:qpin .16s var(--ease)}
#ed #rsub>div>.row{border-top-color:transparent;padding-top:0}
#ed #rcat>div>.row{padding-bottom:6px}

/* 할일 table: near the road line = make something (+ by the line); far out = open that month / week / day */
.ht .pcplus{left:calc(26px + var(--n)*16px);right:auto;top:50%;font-size:14px;color:color-mix(in srgb,var(--ink) 28.9%,var(--paper))}
.ht.v1 .pcplus{left:12px}
.ht .pc:hover .pcplus{opacity:1}
.ht .pc.far{cursor:zoom-in}
.ht .pc.far .pcplus{opacity:0}
.ht .pc:not(.far){cursor:copy}
.ht .pc:not(.none) .pcplus{display:none}

/* no lines between 세부할일 columns inside a 할일 box */
.ht.split .pc:not(.cf){box-shadow:none;border-left:0}

/* ===== round 22 ===== */
.cpick{position:relative;width:22px;height:22px;border-radius:50%;border:var(--lw) dashed color-mix(in srgb,var(--ink) 28.9%,var(--paper));display:inline-flex;align-items:center;justify-content:center;color:color-mix(in srgb,var(--ink) 43.4%,var(--paper));font-size:13px;cursor:pointer;overflow:hidden;background:var(--c,transparent)}
.cpick.on{border:2px solid var(--paper);box-shadow:0 0 0 1.5px var(--ink);color:transparent}
.cpick.sm{width:24px;height:24px;border-radius:5px}
.cpick input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;border:0;padding:0}
.hlrow .sw3,.cpick.sm{width:21px;height:21px}
.hlrow{gap:5px}
.ydot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:auto}
/* year page: little dots under a date */
.mgrid span{flex-direction:column;position:relative}
.mgrid span .yd{position:absolute;left:50%;bottom:-3px;transform:translateX(-50%);display:flex;gap:1.5px;font-style:normal}
.mgrid span .yd i{width:4px;height:4px;border-radius:50%}
.mgrid span.td .yd{bottom:-4px}

/* ---------- sheets (editor · settings) ---------- */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;z-index:10;padding:16px;animation:fadein .15s ease}
.sheet{background:var(--paper);border-radius:12px;width:min(560px,100%);max-height:90vh;overflow-x:hidden;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.12)}
@media (max-width:560px){.ov{align-items:flex-end;padding:0}.sheet{border-radius:14px 14px 0 0;width:100%;padding-bottom:env(safe-area-inset-bottom,0px)}}
.rw{display:grid;grid-template-rows:1fr;transition:grid-template-rows .28s var(--ease)}
.rw>div{overflow:hidden;min-height:0}
.rw.off{grid-template-rows:0fr}
.rw+.rw>div>.row{border-top:var(--hl) solid var(--soft)}
.row{display:flex;align-items:center;gap:10px;padding:10px 16px;min-height:46px}
.row.sm{min-height:38px;padding-block:7px}
.k{width:30px;flex:none;font-size:11px;color:var(--mute);letter-spacing:.04em}
.k.w{width:48px}
.ttl{font-size:14px;font-weight:400;white-space:nowrap}
.ttl small{color:var(--mute);font-size:12px;margin-left:6px}
.sheet input[type=date]{border:0;outline:none;background:transparent;font-size:14px;padding:0;min-width:0}
.sp{flex:1}
.seg{display:inline-flex;border:var(--lw) solid var(--soft);border-radius:5px;overflow:hidden;flex:none;height:26px}
.seg button{font-size:12px;padding:0 11px;color:color-mix(in srgb,var(--ink) 57.9%,var(--paper));display:flex;align-items:center;gap:5px}
.seg button+button{border-left:var(--lw) solid var(--soft)}
.seg button .ck{margin:0;cursor:inherit}
.seg button.on{background:var(--ink);color:var(--paper)}
.seg button.on .ck{border-color:var(--paper);color:var(--paper)}
.seg button.on .ck.nb{border-color:transparent}
.chips{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.chip{border:var(--lw) solid var(--c);border-radius:var(--r);padding:3px 9px;font-size:12px;line-height:1.3;transition:background .15s}
.chip.on{background:var(--t)}
.chips .hint{font-size:11px;color:color-mix(in srgb,var(--ink) 28.9%,var(--paper))}
.pen{width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:var(--r)}
.pen:hover{background:var(--hover)}
.pen svg{width:15px;height:15px}
.txt{flex:1;min-width:0;border:0;outline:none;font-size:15px;background:transparent;padding:2px 0}
.txt::placeholder{color:color-mix(in srgb,var(--ink) 26.0%,var(--paper))}
.dws{display:flex;gap:4px;flex-wrap:wrap}
.dws button{width:30px;height:28px;border-radius:var(--r);font-size:13px;border:var(--lw) solid transparent}
.dws button.on{background:var(--ink);color:var(--paper)}
.dws.warn button{border-color:#c33}
.foot{display:flex;align-items:center;gap:6px;padding:10px 16px 12px;border-top:var(--hl) solid var(--soft);flex-wrap:wrap}
.btn{font-size:13px;padding:5px 14px;border:var(--lw) solid var(--ink);border-radius:var(--r);white-space:nowrap}
.btn.dark{background:var(--ink);color:var(--paper)}
.btn.quiet{border-color:var(--soft);color:color-mix(in srgb,var(--ink) 50.6%,var(--paper))}
.btn.quiet:hover{border-color:var(--ink);color:var(--ink)}
.note{font-size:11px;color:var(--mute)}

/* settings */
.sheet.set{width:min(520px,100%)}
.shead{display:flex;align-items:center;padding:16px 20px 12px;position:sticky;top:0;background:var(--paper);z-index:2;border-bottom:var(--hl) solid var(--soft)}
.shead h4{margin:0;font-size:16px;font-weight:400}
.shead .btn{margin-left:auto;font-size:13px;padding:5px 14px}
.sec{padding:16px 20px 14px}
.stabs{display:flex;gap:2px;margin:0 auto;padding:3px;border-radius:999px;background:color-mix(in srgb,var(--ink) 6%,var(--paper))}
.stabs button{height:30px;padding:0 14px;border-radius:999px;font-size:13px;color:color-mix(in srgb,var(--ink) 55%,var(--paper));transition:background .2s,color .2s}
.stabs button.on{background:var(--paper);color:var(--ink);font-weight:500;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.shead .stabs+.btn{margin-left:0}
@media (max-width:420px){.stabs button{padding:0 10px}.shead h4{display:none}.shead .stabs{margin-left:0}}
.sgrp{display:flex;align-items:center;gap:8px;margin-top:10px;padding:12px 20px;font-size:15px;font-weight:600;color:var(--ink);background:color-mix(in srgb,var(--ink) 5%,var(--paper));border-top:var(--lw) solid var(--soft);border-bottom:var(--lw) solid var(--soft)}
.sgrp small{font-size:11.5px;font-weight:400;color:var(--mute)}
.shead+.sgrp{margin-top:0;border-top:0}
.sgrp+.sec{padding-top:18px}
.sec+.sec{border-top:var(--hl) solid var(--soft)}
.sh{font-size:14px;font-weight:500;margin-bottom:2px}
.sd{font-size:12px;color:var(--mute);margin-bottom:10px;line-height:1.5}
.srow{display:flex;align-items:center;gap:10px;min-height:40px;font-size:14px}
.srow .lab{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mks{display:inline-flex;align-items:stretch;height:30px;border:var(--lw) solid var(--soft);border-radius:6px;overflow:hidden;flex:none}
.mko{width:32px;display:flex;align-items:center;justify-content:center;font-size:14px;transition:background .15s}
.mko+.mko,.mkc{border-left:var(--lw) solid var(--soft)}
.mko .ck{margin:0;cursor:inherit}
.mko:hover{background:var(--hover)}
.mko.on{background:var(--ink)}
.mko.on .ck{border-color:var(--paper);color:var(--paper)}
.mko.on .ck.nb{border-color:transparent}
.mkc{width:46px;border-top:0;border-right:0;border-bottom:0;text-align:center;font-size:12px;outline:none;padding:0 2px;background:transparent}
.mkc::placeholder{color:color-mix(in srgb,var(--ink) 31.5%,var(--paper))}
.mkc.on{background:var(--ink);color:var(--paper)}
.mks.big{height:auto;border:0;border-radius:0;gap:6px;flex-wrap:wrap;overflow:visible}
.mks.big .mko,.mks.big .mkc{width:auto;min-width:62px;height:52px;border:var(--lw) solid var(--soft);border-radius:6px;flex-direction:column;gap:5px;font-size:11px;color:color-mix(in srgb,var(--ink) 65.1%,var(--paper));padding:0 8px}
.mks.big .mko .ck{font-size:15px}
.mks.big .mko.on{background:var(--paper);border-color:var(--ink);color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.mks.big .mko.on .ck{border-color:var(--ink);color:var(--ink)}
.mks.big .mko.on .ck.nb{border-color:transparent}
.mks.big .mkc{width:74px;font-size:15px}
.mks.big .mkc.on{background:var(--paper);color:var(--ink);border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.clist{display:flex;flex-direction:column;border:var(--lw) solid var(--soft);border-radius:8px;overflow:hidden}
.crow{display:flex;align-items:center;gap:8px;min-height:48px;padding:0 12px 0 6px;background:var(--paper);font-size:14px}
.crow+.crow,.cdiv+.crow{border-top:var(--hl) solid var(--soft)}
.crow.dragging{box-shadow:0 4px 16px rgba(0,0,0,.14);position:relative;z-index:2}
.hd{flex:none;width:20px;height:32px;display:flex;align-items:center;justify-content:center;color:color-mix(in srgb,var(--ink) 28.1%,var(--paper));cursor:grab;touch-action:none;font-size:14px;user-select:none}
.hd:hover{color:var(--ink)}
.crow .cn{flex:1;min-width:0;color:color-mix(in srgb,var(--ink) 72.3%,var(--paper))}
.crow .cn small{color:var(--mute);font-size:11px;margin-left:6px}
.crow .nm{flex:1;min-width:0;border:var(--lw) solid transparent;border-radius:var(--r);outline:none;font-size:14px;padding:4px 6px;margin-left:-6px;background:transparent}
.crow .nm:hover{border-color:var(--soft)}
.crow .nm:focus{border-color:var(--ink)}
.crow .emo{flex:none;width:30px;height:28px;text-align:center;border:var(--lw) solid var(--soft);border-radius:var(--r);outline:none;font-size:14px;padding:0;background:transparent}
.crow .emo:focus{border-color:var(--ink)}
.sw{flex:none;position:relative;width:16px;height:16px;border-radius:50%;background:var(--c);cursor:pointer}
.sw input{position:absolute;inset:-6px;opacity:0;cursor:pointer;width:28px;height:28px;border:0;padding:0}
.sw.none{background:transparent;border:var(--lw) dashed color-mix(in srgb,var(--ink) 36.2%,var(--paper))}
.sw.base{background:transparent;border:var(--lw) solid var(--faint);cursor:default}
.nocol,.crow .x{flex:none;width:24px;height:24px;border-radius:var(--r);color:color-mix(in srgb,var(--ink) 36.2%,var(--paper));font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center}
.nocol:hover,.crow .x:hover{background:var(--hover);color:var(--ink)}
.xsp{flex:none;width:24px}
.cdiv{height:3px;background:var(--hover)}
.addc{display:flex;align-items:center;gap:8px;font-size:13px;color:color-mix(in srgb,var(--ink) 57.9%,var(--paper));height:36px;padding:0 12px;margin-top:8px;border:var(--lw) dashed var(--faint);border-radius:8px;width:100%}
.addc:hover{border-color:var(--ink);color:var(--ink)}
.set .seg{height:30px}
.set .seg button{font-size:13px;padding:0 12px}
.snote{font-size:12px;color:var(--mute);padding:12px 0 2px}
.hint{font-size:11px;color:var(--mute);margin-top:8px}
.txt:focus-visible,.add input:focus-visible,.nm:focus-visible,.mkc:focus-visible,.emo:focus-visible{outline:none}
@media (max-width:520px){.row{gap:8px;padding-inline:12px}.sec,.shead,.foot{padding-left:16px;padding-right:16px}.seg button{padding:0 8px}.crow{gap:6px}.crow .mks .mko{width:28px}.crow .mkc{width:36px}}
/* sheet extras */
.ov.still{animation:none}
.sheet .txt.sm{font-size:13.5px}
.rw.warn .k{color:#c33}
.rw.warn .chips .chip{border-style:dashed}
.tabs{display:flex;border-bottom:var(--hl) solid var(--soft);padding:0 10px}
.tabs button{flex:1;height:44px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13.5px;color:color-mix(in srgb,var(--ink) 43.4%,var(--paper));border-bottom:2px solid transparent;margin-bottom:-.5px}
.tabs button .ck{margin:0}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
.sheet.v2 .rw+.rw>div>.row{border-top:0}
.sheet.v2 .row{min-height:42px;padding-block:7px}
.sw2{width:22px;height:22px;border-radius:50%;background:var(--c);border:2px solid var(--paper);box-shadow:0 0 0 1px transparent}
.sw2.on{box-shadow:0 0 0 1.5px var(--ink)}
.vopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.vopt{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;padding:10px 12px;border:var(--lw) solid var(--soft);border-radius:8px}
.vopt b{font-size:11px;font-weight:400;color:var(--mute)}
.vopt span{font-size:14px}
.vopt small{font-size:11px;color:var(--mute);line-height:1.45}
.vopt:hover{border-color:var(--faint)}
.vopt.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.dws button{width:32px}

/* ===== edit sheet: every row is always there (unused ones only fade), so switching 할일 · 일정 · 루틴 never changes its size ===== */
.ehead{padding:14px 18px 4px}
.ebar{display:flex;align-items:center;gap:6px;margin:6px 16px 6px;padding:0 14px 0 5px;height:46px;border:var(--lw) solid var(--ink);border-radius:999px}
.ebar .txt{font-size:15px}
.ekm{flex:none;display:flex;align-items:center;gap:5px;font-size:12.5px;color:color-mix(in srgb,var(--ink) 65.1%,var(--paper));padding:5px 9px 5px 7px;border-radius:999px;white-space:nowrap}
.ekm .ck{margin:0;font-size:14px}
.ekm:not(.still):hover{background:var(--hover);color:var(--ink)}
.egrid{display:flex;flex-direction:column;padding:0 16px}
.erow{display:flex;align-items:center;gap:10px;height:46px;border-top:var(--hl) solid var(--hair)}
.egrid>.erow:first-child{border-top:0}
.ek{flex:none;width:36px;font-size:11px;color:var(--mute);letter-spacing:.04em}
.evl{flex:1;min-width:0;display:flex;align-items:center;gap:6px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;height:100%}
.evl::-webkit-scrollbar{display:none}
.evl .chips{flex-wrap:nowrap}
.evl .chip,.evl .qc{flex:none;white-space:nowrap}
.evl .txt{border:var(--lw) solid var(--soft);border-radius:6px;padding:7px 10px}
.evl .txt:focus{border-color:var(--ink)}
.qc.estar{font-size:12px;padding:5px 11px}
.qc.estar.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.qc:disabled,.qc.estar:disabled{opacity:.35;cursor:default}
.dws.off button{opacity:.28;cursor:default}
.ehint{font-size:12px;color:color-mix(in srgb,var(--ink) 28.9%,var(--paper));white-space:nowrap}
.enote{height:24px;font-size:11px;color:var(--mute);padding:5px 0 0 46px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ed .foot{min-height:60px}

/* ===== 월 · 주 페이지: telling 세부할일 of the same 할일 apart (설정 → 세부 구분) =====
   every row filed under a 세부 carries its name (.stag) and its own shade (--hs); the chosen version shows one of them */
.stag{display:none}
.sbx.hl-hc .it.k-hg{border-radius:2px;margin:1px -3px;padding:0 3px;background:var(--hc)}
#app.sb1 .board .it.k-sb .stag,#app.sb1 .pwk .it.k-sb .stag,.sbx.sb1 .it.k-sb .stag{display:inline;flex:none;font-size:.78em;line-height:1.3;color:color-mix(in srgb,var(--ink) 57.9%,var(--paper));background:var(--tag);border-radius:3px;padding:0 .35em;margin-top:.12em;white-space:nowrap}
#app.sb3 .board .it.k-sb,#app.sb3 .pwk .it.k-sb,.sbx.sb3 .it.k-sb{border-radius:2px;margin:1px -3px;padding:0 3px;background:var(--hs)}
/* 세부분야 표시 versions 4–7 (1 = grey tag, above) */
#app.sb4 .board .it.k-sb .stag,#app.sb4 .pwk .it.k-sb .stag,.sbx.sb4 .it.k-sb .stag,#app.sb5 .board .it.k-sb .stag,#app.sb5 .pwk .it.k-sb .stag,.sbx.sb5 .it.k-sb .stag,#app.sb6 .board .it.k-sb .stag,#app.sb6 .pwk .it.k-sb .stag,.sbx.sb6 .it.k-sb .stag,#app.sb7 .board .it.k-sb .stag,#app.sb7 .pwk .it.k-sb .stag,.sbx.sb7 .it.k-sb .stag{display:inline-flex;align-items:center;flex:none;font-size:.78em;line-height:1.3;white-space:nowrap;margin-top:.12em}
#app.sb4 .board .it.k-sb .stag,#app.sb4 .pwk .it.k-sb .stag,.sbx.sb4 .it.k-sb .stag{border:1px solid var(--hsd,var(--mute));color:var(--hsd,var(--sub));background:color-mix(in srgb,var(--paper) 70%,transparent);border-radius:999px;padding:0 .5em}
#app.sb5 .board .it.k-sb .stag,#app.sb5 .pwk .it.k-sb .stag,.sbx.sb5 .it.k-sb .stag{background:var(--hsd,var(--sub));color:#fff;border-radius:999px;padding:0 .55em;font-weight:500}
#app.sb6 .board .it.k-sb .stag,#app.sb6 .pwk .it.k-sb .stag,.sbx.sb6 .it.k-sb .stag{gap:.3em;color:color-mix(in srgb,var(--ink) 62%,var(--paper))}
#app.sb6 .board .it.k-sb .stag::before,#app.sb6 .pwk .it.k-sb .stag::before,.sbx.sb6 .it.k-sb .stag::before{content:'';width:.55em;height:.55em;border-radius:50%;background:var(--hsd,var(--mute));flex:none}
#app.sb7 .board .it.k-sb .stag,#app.sb7 .pwk .it.k-sb .stag,.sbx.sb7 .it.k-sb .stag{color:color-mix(in srgb,var(--ink) 52%,var(--paper));margin-left:-.15em}
#app.sb7 .board .it.k-sb .stag::before,#app.sb7 .pwk .it.k-sb .stag::before,.sbx.sb7 .it.k-sb .stag::before{content:'·';margin-right:.3em}
#app.sb7 .board .it.k-sb .tx,#app.sb7 .pwk .it.k-sb .tx,.sbx.sb7 .it.k-sb .tx{flex:0 1 auto}
#app.sb7 .board .it.k-sb .tag,#app.sb7 .board .it.k-sb .aux:not(.sumn){margin-left:auto}
.it.sum .aux.sumn{flex:none;margin-left:auto;padding-left:.35em;font-size:1em;letter-spacing:0;color:inherit;padding-top:0}
.sbx{display:flex;flex-direction:column;gap:2px;margin-top:6px;width:100%}
.sbx .it{font-size:12px}
.vopt .sbx span,.vopt .sbx i{font-size:12px}
.vopt .sbx .tx{color:var(--ink)}
.vopt .sbx .stag{font-size:10px}



/* 설정 → 테마: ready-made pairs of ink and paper */
.thms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:330px}
.thm{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;color:var(--sub)}
.thm .tsw{width:100%;aspect-ratio:1.2;border-radius:9px;background:var(--tp);color:var(--ti);border:1px solid color-mix(in srgb,var(--ink) 14%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;transition:box-shadow .2s}
.thm .tsw b{font-weight:500;font-size:15px;line-height:1}
.thm .tsw i{width:46%;height:2px;border-radius:1px;background:var(--ti)}
.thm.on .tsw{box-shadow:0 0 0 2px var(--paper),0 0 0 3.5px var(--ink)}
.thm.on .tnm{color:var(--ink)}

html,body{transition:background-color .25s ease,color .25s ease}
html.dark .ov{background:rgba(0,0,0,.5)}
html.dark .sheet,html.dark .qpop,html.dark .qcal{box-shadow:0 10px 36px rgba(0,0,0,.5)}

/* ===== 할일 page: dates as small words only (설정 → 할일 페이지 날짜 칸) ===== */
.ht.nolab .hlab{border:0!important;border-radius:0!important;background:none;justify-content:flex-end;padding:0 9px 0 0;min-height:22px;gap:4px}
.ht.nolab .hlab b{font-size:11px;font-weight:400;color:var(--sub)}
.ht.nolab .hlab span{font-size:9px}
.ht.nolab .hlab.td b{color:var(--paper)}
.ht.nolab .hh.corner{border:0!important;text-align:right;padding:0 9px 4px 0;font-size:10px;color:var(--mute)}
/* ★ = a big circle on the 할일 page, whatever it is (할일 · 일정 · 루틴) */
.pst.star button{width:20px;height:20px;border-radius:50%;margin:0}
.ht.v2 .pst.star button{left:calc(20px + var(--j)*16px - 10px)}
.pst.star:not(.end) button:not(.done){border-color:color-mix(in srgb,var(--ink) 32.3%,var(--paper))}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}


/* ===== modern roadmap: the same table, a calmer surface ===== */
.ht.split{--rr:10px}
.ht.split .pc{border-color:color-mix(in srgb,var(--ink) 11%,var(--paper))!important;background:color-mix(in srgb,var(--ink) 1.6%,var(--paper))}
.ht.split .pc.r0.cf{border-top-left-radius:var(--rr)}
.ht.split .pc.r0.cl{border-top-right-radius:var(--rr)}
.ht.split .pc.rl.cf{border-bottom-left-radius:var(--rr)}
.ht.split .pc.rl.cl{border-bottom-right-radius:var(--rr)}
.ht.split .pc.blk{border-top-style:solid!important;border-top-width:1px!important;border-top-color:color-mix(in srgb,var(--ink) 5%,transparent)!important}
.ht.split .pc.r0{border-top-color:color-mix(in srgb,var(--ink) 11%,var(--paper))!important}
.ht.split .pc.td{background:color-mix(in srgb,var(--ink) 4.5%,var(--paper))}
.ht.split .pc:hover{background:color-mix(in srgb,var(--ink) 3%,var(--paper))}
.ht.split .hlab b{white-space:nowrap}
.ht.split .hlab.td b{border-radius:5px;padding:1px 4px}
/* the road: a soft track in the 할일's colour */
.ht.split .ln.base{background:color-mix(in srgb,var(--cc,var(--ink)) 30%,transparent)!important;width:2px!important;margin-left:-1px!important;border-radius:2px}
html.dark .ht.split .ln.base{background:color-mix(in srgb,var(--cc,var(--ink)) 50%,transparent)!important}
.ht.split .pc.r0 .ln.base{top:8px}
.ht.split .pc.rl .ln.base{bottom:8px}
/* marks on the road */
.ht.split .pdot{border-color:var(--cc,var(--ink));border-width:1.5px;border-radius:4px;background:var(--paper)}
.ht.split .pdot.e{background:var(--cc,var(--ink));border:0;border-radius:50%}
.ht.split .pdot.c{border-radius:50%;box-shadow:0 0 0 3px color-mix(in srgb,var(--cc,var(--ink)) 16%,transparent)}
.ht.split .pm.done .pdot,.ht.split .pm.gen.done .pdot{background:var(--cc,var(--ink));border-color:var(--cc,var(--ink))}
.ht.split .pm .pt{color:var(--ink)}
.ht.split .pm.done .pt{color:var(--mute)}
.ht.split .pm small{color:var(--mute);font-variant-numeric:tabular-nums}
.ht.split .pst button{border-color:color-mix(in srgb,var(--cc,var(--ink)) 55%,var(--paper));border-width:1.5px;border-radius:3px;background:var(--paper)}
.ht.split .pst.end button{border-color:var(--cc,var(--ink))}
.ht.split .pst button.done{background:var(--cc,var(--ink));border-color:var(--cc,var(--ink))}
.ht.split .pst.star button{border-radius:50%;box-shadow:0 0 0 3px color-mix(in srgb,var(--cc,var(--ink)) 16%,transparent)}
.ht.split .pst span{color:var(--sub)}
.ht.split .pst.end span{color:var(--ink)}
.ht.split .ldot i{background:var(--cc,var(--mute));opacity:.8}
.ht.split .ldot.done i,.ht.split .ldot.run i{opacity:.35}
/* + by the road: a small soft circle */
.ht .pcplus{width:18px;height:18px;margin-left:-4px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--cc,var(--ink)) 14%,transparent);color:var(--cc,var(--ink));font-size:13px;line-height:1;transition:opacity .15s}
/* headers: name · % · a slim progress bar */
.ht.split .hh.subh{display:grid!important;grid-template-columns:minmax(0,1fr) auto;align-items:end;column-gap:6px;row-gap:5px;padding:0 10px 7px!important}
.ht.split .hh.subh small{font-size:10.5px;color:var(--mute);font-variant-numeric:tabular-nums;margin:0}
.ht.split .hh .pbar{grid-column:1/-1;height:3px;border-radius:2px;background:color-mix(in srgb,var(--cc) 16%,transparent);overflow:hidden;display:block}
.ht.split .hh .pbar b{display:block;height:100%;border-radius:2px;background:var(--cc);transition:width .4s var(--ease)}
.ht.split .hh:hover .nm{text-decoration:none}
.ht.split .hh.subh:hover .nm{color:var(--cc)}
.ht.nolab .hh.corner{padding-bottom:7px}
.hstack{border-color:color-mix(in srgb,var(--ink) 11%,var(--paper));border-radius:10px;background:color-mix(in srgb,var(--ink) 1.6%,var(--paper))}

/* ===== round 24 ===== */
/* 할일 page: 로드맵 목록 above 보관함 */
.hstackw{display:flex;flex-direction:column}
.hroad{border:var(--lw) solid color-mix(in srgb,var(--ink) 11%,var(--paper));border-radius:10px;background:color-mix(in srgb,var(--ink) 1.6%,var(--paper));padding:7px 9px;display:flex;flex-direction:column;gap:1px;max-height:44vh;overflow:auto;margin-bottom:12px}
.hroad .it{font-size:12px}
.hroad .it .aux{font-size:10px;letter-spacing:0;color:var(--mute);font-variant-numeric:tabular-nums}
.hroad .gh:first-child{margin-top:0}
.rltd{display:block;height:0}
.rlnil{font-size:11.5px;color:var(--mute);padding:2px 0 4px}
.hstackw .hstack{max-height:max(160px,calc(100vh - 230px - 44vh))}
.portrait .hroad{max-height:none}
.portrait .hstackw .hstack{max-height:none}
/* 월 캘린더 · 주간목표 칸: 길면 줄을 넘기지 않고 "□ 어쩌…" 한 줄로 (세부 이름표는 빼고) */
.board.month .cell:not(.fold) .cb .it .tx,.board.month .wrow .wlist .it .tx,.full .cb .it .tx{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;word-break:normal}
#app .board.month .cell .cb .it .tag{display:none}
.board.month .cell .cb .it,.board.month .wrow .wlist .it{flex-wrap:nowrap}
/* tall screens: the year scrolls instead of being squeezed into one screen */
.portrait .year{height:auto}
.portrait .months{height:auto;grid-template-rows:none}
.portrait .mface{aspect-ratio:7/6}

/* ===== round 25 ===== */
/* 할일 page: a filled cell keeps a small + at its right end */
.ht.split .pc:not(.none) .pin{padding-right:20px}
.pcadd{position:absolute;right:4px;top:50%;transform:translateY(-50%);z-index:3;width:15px;height:15px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;line-height:1;color:var(--cc,var(--ink));background:none;opacity:0;transition:opacity .15s,background .15s}
.pc:hover .pcadd{opacity:.5}
.pcadd:hover{opacity:1;background:color-mix(in srgb,var(--cc,var(--ink)) 14%,transparent)}
@media (pointer:coarse){.pcadd{opacity:.22}}
/* 할일 page: ★ circles never sit on top of each other */
.ht.split .pm.star,.ht.split .pst.star{min-height:24px}
.ht.split .pin{gap:3px}
.ht.split .pm.star+.pm.star,.ht.split .pst.star+.pm.star,.ht.split .pm.star+.pst.star{margin-top:2px}
/* tall week: a little room between Mon… and the list, as on the month page */
.portrait .board.week .days{margin-top:6px}
.portrait .board.week .wkbox{margin-top:6px}

/* ===== round 26 (experiment): 일 page · stacked 주 · 연도별 · 순서대로 ===== */
.pill{grid-template-columns:repeat(4,46px)}
.portrait .pill{grid-template-columns:repeat(4,35px)}
.portrait .pill .knob{width:35px}
.portrait .pill button{font-size:12px}
.portrait header{grid-template-columns:minmax(0,1fr) auto auto}
.portrait .ptl .ts.d{display:none}
.portrait .ptl[data-lv="2"] .ts.y,.portrait .ptl[data-lv="3"] .ts.y{display:none}
.portrait .ptl[data-lv="2"] .ts.m,.portrait .ptl[data-lv="3"] .ts.m{padding-left:0}
.ptl .ts.d{font-size:.8em;padding-left:.4em}
.board.day .dow .dw{cursor:pointer}
.board.day .dow .dw.sel{color:var(--ink);font-weight:500;box-shadow:inset 0 -1.5px 0 var(--ink)}
.board.day:not(.v2) .days.one .dcol{padding:14px 18px 20px}
.board.day:not(.v2) .days.one .dlist{font-size:14px}

<script>
(() => {
const KEY = 'bw-planner-demo-v1';
const DOW = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DOW_U = ['M','T','W','T','F','S','S'];
const DOW_L = ['m','t','w','t','f','s','s'];
const DOW_K = ['월','화','수','목','금','토','일'];
const coarse = matchMedia('(pointer: coarse)').matches;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const EASE = 'cubic-bezier(.4,0,.2,1)';

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pIso = s => new Date(s+'T00:00:00');
const mk = (y,m) => `${y}-${pad(m+1)}`;
const addDays = (d,n) => new Date(d.getFullYear(), d.getMonth(), d.getDate()+n);
const isoAdd = (k,n) => iso(addDays(pIso(k), n));
const dowOf = d => (d.getDay()+6)%7;
const mondayOf = d => addDays(d, -dowOf(d));
const md = k => { const d = pIso(k); return `${d.getMonth()+1}.${d.getDate()}`; };
const REP = '';   // no separate sign for a 반복
const OPEN = '9999-12-31';   // a 할일 루틴 with 끝 없음: its "last day" never comes, so every date comparison still works
function monthGrid(y,m){
  const first = new Date(y,m,1), last = new Date(y,m+1,0); let cur = mondayOf(first); const w = [];
  while (cur <= last){ w.push(Array.from({length:7},(_,i)=>addDays(cur,i))); cur = addDays(cur,7); }
  return w;
}
const today = new Date(); today.setHours(0,0,0,0);
const TODAY = iso(today);
const dday = k => { const n = Math.round((pIso(k) - pIso(TODAY))/864e5); return n===0 ? 'D-day' : n>0 ? `D-${n}` : `D+${-n}`; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2,10);
const segm = (typeof Intl!=='undefined' && Intl.Segmenter) ? new Intl.Segmenter('ko',{granularity:'grapheme'}) : null;
const graphemes = s => segm ? [...segm.segment(s)].map(x=>x.segment) : [...s];
const clip = (s,n) => graphemes(s).slice(0,n).join('');
const lastOf = ym => iso(new Date(+ym.slice(0,4), +ym.slice(5,7), 0));
const monthDue = ym => ym===TODAY.slice(0,7) ? TODAY : lastOf(ym);   // a month's default day: today in this month, else its last day (past months stay in the past)
const sameDayIn = (ym, k) => { const d = k ? pIso(k).getDate() : 28, e = lastOf(ym); return `${ym}-${pad(Math.min(d, +e.slice(8)))}`; };

/* ---------- store ----------
   days[iso] [{id,text,type:'event'|'todo',done,memo?,cat?,sub?}]   weeks[mon] [{id,text,done,cat?,sub?}] = weekly goals
   routines [{id,text,dows,start,end?}]  rdone['iso|rid']
   할일: cats [{id,name,color,emoji}] → subs [{id,cat,name}] → ms (milestones) [{id,sub,text,due,dows,done,created}]
         small daily steps run from the day after the previous milestone up to its due day; sdone['iso|msid']
   stack.all [{id,text,done,cat?,sub?}] = 쌓아두기 (not yet scheduled)
   set {ver:1|2|3 (how things are created), pmv:1|2 (tall-screen month page), hv:1|2|3 (할일 page: 표 · 로드맵 · 목록)}
   ms.start (optional) lets milestones run at the same time; stack items carry kind 'ms'|'todo' */
/* ---------- keeping the data safe across updates ----------
   · KEY never changes — a new key would make the saved data look gone.
   · SCHEMA is the shape of the data; MIGRATIONS turn an older shape into the new one, step by step, never dropping anything.
   · KEY+'-backup' holds a copy taken once a day (and right before a migration); unreadable data is put aside, never overwritten. */
const SCHEMA = 3;
const MIGRATIONS = {
  2: s => { s.rskip ||= {}; s.sskip ||= {}; },   // 1 → 2: routine days removed one by one
  // 2 → 3: 루틴 is gone as a kind — every routine (plain or filed under a 세부할일) stays exactly where it is and is now a 반복 할일.
  //        Only the settings that were for 루틴 alone are folded into 할일's.
  3: s => { const set = s.set || {};
    if (set.ys?.routine){ set.ys.todo = true; } if (set.ys) delete set.ys.routine;
    if (set.hlc) delete set.hlc.routine;
    if (set.hfull) delete set.hfull.routine; }
};
const store = {
  get: k => { try { return localStorage.getItem(k); } catch(e) { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); return true; } catch(e) { return false; } }
};
const isData = s => !!(s && typeof s==='object' && s.days && typeof s.days==='object');
// 처음 여는 기기의 예시: 사용자가 직접 다듬은 상태(2026-11-23 주 기준)를 그대로 담고,

function importICS(text){
  const lines = String(text).replace(/\r?\n[ \t]/g, '').split(/\r?\n/), have = new Set(Object.values(S.days).flat().map(i => i.ics).filter(Boolean));
  const val = l => l.slice(l.indexOf(':') + 1).replace(/\\n/gi, '\n').replace(/\\([,;\\])/g, '$1');
  let ev = null, n = 0, skip = 0;
  for (const l of lines){
    if (l==='BEGIN:VEVENT'){ ev = {}; continue; }
    if (l==='END:VEVENT'){ if (ev?.start && ev.text){ if (ev.uid && have.has(ev.uid)) skip++; else {
        const o = {id:uid(), text:ev.text, type:'event', done:false}; if (ev.time) o.time = ev.time; if (ev.memo) o.memo = ev.memo;
        if (ev.yearly) o.yearly = true; else if (ev.end && ev.end > ev.start) o.end = ev.end; if (ev.uid) o.ics = ev.uid; L('days', ev.start).push(o); n++; } }
      ev = null; continue; }
    if (!ev) continue;
    const name = l.split(/[;:]/)[0].toUpperCase();
    if (name==='SUMMARY') ev.text = val(l).trim();
    else if (name==='DESCRIPTION') ev.memo = val(l).trim().slice(0, 500);
    else if (name==='UID') ev.uid = val(l).trim();
    else if (name==='RRULE') ev.yearly = /FREQ=YEARLY/i.test(l);
    else if (name==='DTSTART' || name==='DTEND'){
      const m = val(l).trim().match(/^(\d{4})(\d\d)(\d\d)(?:T(\d\d)(\d\d)\d*(Z)?)?/); if (!m) continue;
      const d = m[6] ? new Date(Date.UTC(+m[1], +m[2]-1, +m[3], +m[4], +m[5])) : new Date(+m[1], +m[2]-1, +m[3], +(m[4] || 0), +(m[5] || 0));
      const k = iso(d), t = m[4] ? `${pad(d.getHours())}:${pad(d.getMinutes())}` : '';
      if (name==='DTSTART'){ ev.start = k; if (t && t!=='00:00') ev.time = t; } else ev.end = m[4] ? k : isoAdd(k, -1); }   // an all-day end is the day after
  }
  if (n) save(); return {n, skip}; }

const HFIX = {'01-01':'신정','03-01':'삼일절','05-05':'어린이날','06-06':'현충일','08-15':'광복절','10-03':'개천절','10-09':'한글날','12-25':'성탄절'};   // when offline
const HOL = {}, holAsked = new Set();
function holLoad(y){
  if (holAsked.has(y) || !(y > 1900)) return; holAsked.add(y);
  const key = `${KEY}-hol-${y}`; let c = null; try { c = JSON.parse(store.get(key)); } catch(e) {}
  const fixedName = new Set(Object.values(HFIX));
  const put = list => { const m = {};
    list.forEach(([k, n]) => { if (fixedName.has(n) && HFIX[k.slice(5)]!==n) n = '대체공휴일'; m[k] = m[k] && m[k]!==n ? m[k] + ' · ' + n : n; });
    Object.keys(m).forEach(k => { const k2 = isoAdd(k, 2), k1 = isoAdd(k, 1); if (!m[k1] && m[k2]===m[k] && !HFIX[k1.slice(5)]) m[k1] = m[k]; });
    Object.assign(HOL, m); };
  if (c?.list) put(c.list);
  if (c && Date.now() - c.at < 30*864e5) return;
  try { fetch(`https://date.nager.at/api/v3/PublicHolidays/${y}/KR`).then(r => r.ok ? r.json() : null).then(a => {
    if (!Array.isArray(a)) return; const list = a.map(h => [h.date, h.localName || h.name]);
    store.set(key, JSON.stringify({at:Date.now(), list})); put(list);
    if (!st.ed && !st.qp && !st.setOpen && !st.boxOpen) refreshBehind(); }).catch(() => {}); } catch(e) {}
}
const holOf = k => { holLoad(+k.slice(0,4)); return HOL[k] || HFIX[k.slice(5)] || ''; };

// milestones that overlap in time get their own lane, so things running together sit side by side

  if (m.due!==OPEN){ n = 0; while (b >= a && n++ < 400 && !stepsOn(b).includes(m)) b = isoAdd(b, -1); }
  return a > b ? {a: msStart(m), b: m.due} : {a, b};
}
function lanesOf(sid){
  const list = msOf(sid).filter(m => m.due).map(m => ({m, ...realSpan(m)})).sort((x,y) => x.a.localeCompare(y.a) || x.b.localeCompare(y.b));
  const ends = [], lane = {};
  list.forEach(x => { // only a milestone given its own start can truly overlap; the rest always stay on lane 0
    let j = x.m.start ? ends.findIndex(e => e < x.a) : 0; if (j<0){ j = ends.length; ends.push(''); }
    if (!ends.length) ends.push(''); ends[j] = ends[j] > x.b ? ends[j] : x.b; lane[x.m.id] = j; });

/* going down a level: the chosen month / week stretches open, the rest folds away */
// changing 연 ⇄ 월 ⇄ 주: the box grows to its new size while each thing glides to where it now belongs
// things glide from where they were to where they now are (FLIP). Only the outermost marked element moves,
// so a circle never gets moved twice (once with its row, once on its own)
const flipEls = root => [...root.querySelectorAll('[data-ref], [data-fk]')].filter(el => !el.parentElement.closest('[data-ref], [data-fk]') || el.dataset.fk);
const flipKey = el => el.dataset.fk || el.dataset.ref;
function snapHal(){
  const tbl = app.querySelector('.htable'), at = {}; if (!tbl) return {at};
  flipEls(tbl).forEach(el => { const k = flipKey(el); if (!at[k]) at[k] = el.getBoundingClientRect(); });
  return {at, box: tbl.getBoundingClientRect()};
}
function flipFrom(before, ms=480){
  const tbl = app.querySelector('.htable'); if (!tbl) return;
  const box0 = before.box, box1 = tbl.getBoundingClientRect(), ease = 'cubic-bezier(.3,.1,.2,1)';
  if (box0) tbl.animate([{height:box0.height+'px', overflow:'hidden'}, {height:box1.height+'px', overflow:'hidden'}], {duration:ms, easing:ease});
  const seen = new Set();
  flipEls(tbl).forEach(el => { const k = flipKey(el), o = before.at[k], n = el.getBoundingClientRect();
    if (o && !seen.has(k)){ seen.add(k); const dx = o.left-n.left, dy = o.top-n.top; if (Math.abs(dx) + Math.abs(dy) > .5) el.animate([{transform:`translate(${dx}px,${dy}px)`}, {transform:'translate(0,0)'}], {duration:ms, easing:ease}); }
    else if (!el.dataset.fk) el.animate([{opacity:0}, {opacity:1}], {duration:300, delay:ms*.45, easing:'ease', fill:'backwards'}); });
  tbl.querySelectorAll('.ln, .ldot, .pst').forEach(el => el.animate([{opacity:0}, {opacity:1}], {duration:280, delay:ms*.5, fill:'backwards'}));   // road lines settle in after the move
}
function halGo(keep, apply){
  if (reduced || st.busy){ apply(); render(); return; }
  const before = snapHal(); apply(); render(); flipFrom(before);
}
// narrowing (전체 → a 할일, → a 세부할일): what is left of the chosen one leaves to the left, what is right of it leaves to the right,
// then the chosen one slides to the far left and widens
function halNarrow(keepCol, apply){
  const cells = [...app.querySelectorAll('.ht [data-col]')];
  const kept = cells.filter(c => keepCol(c.dataset.col)), going = cells.filter(c => !keepCol(c.dataset.col));
  if (reduced || st.busy || !going.length || !kept.length){ apply(); render(); return; }
  st.busy = true;
  const x0 = Math.min(...kept.map(c => c.getBoundingClientRect().left));
  going.forEach(c => c.classList.add(c.getBoundingClientRect().left < x0 ? 'slideL' : 'slideR'));
  setTimeout(() => { st.busy = false; const before = snapHal(); apply(); render(); flipFrom(before, 420); }, 260);
}

function unfoldTo(wk, sel){

  save(); render(); };
document.addEventListener('pointerup', endChip);
document.addEventListener('pointercancel', () => { if (chipDrag && !chipDrag.on){ clearTimeout(chipDrag.t); chipDrag = null; } else endChip(); });
document.addEventListener('click', e => { if (st.noClick && Date.now() - st.noClick < 400){ e.stopPropagation(); e.preventDefault(); st.noClick = 0; } }, true);
document.addEventListener('contextmenu', e => { if (e.target.closest?.('.hrow .hchip')) e.preventDefault(); });
document.addEventListener('contextmenu', e => { if (pd || drag) e.preventDefault(); });
document.addEventListener('click', e => { if (Date.now() - noClick < 250){ e.stopPropagation(); e.preventDefault(); } }, true);
document.addEventListener('dragstart', e => { if (e.target.closest?.('[data-drag]')) e.preventDefault(); });

function takeItem(ref){ const [c,k,id] = ref.split('|'); const l = L(c,k), it = l.find(x => x.id===id); if (it) S[c][k] = l.filter(x => x!==it); return it; }
function dropOn(t, ref, x, y){
  const [dc, dk, dx] = t.dataset.drop.split('|'), [sc, sk, sid] = ref.split('|');
  if (sc==='box'){ if (boxMoveTo([sid], t.dataset.drop)){ closeBox(); render(); toast('보관함에서 옮겼어요'); } else toast('여기에는 놓을 수 없어요'); return; }
  const when = d => d.length===7 ? null : d;   // a month cell keeps the day of the month where it can
  if (sc==='ms'){ // a milestone stays a milestone; only its day (or 세부할일) moves
    const m = msById(sid); if (!m) return;
    const open = m.due===OPEN;   // one without an end moves its start instead
    if (dc==='days'){ if (open) m.start = dk; else m.due = dk; }
    else if (dc==='weeks'){ if (open) m.start = dk; else m.due = isoAdd(dk, m.due ? dowOf(pIso(m.due)) : 6); }
    else if (dc==='pc'){ if (dk) m.sub = dk; const k = dx.length===7 ? sameDayIn(dx, open ? m.start : m.due) : dx;
      if (open) m.start = k; else { m.due = k; if (m.start && m.start>m.due) delete m.start; } }
    else if (dc==='stack'){ const o = {id:uid(), text:m.text, done:m.done, kind:'ms', dows:m.dows}; setCS(o, subById(m.sub)?.cat, m.sub); if (m.star) o.star = true; if (m.ev) o.ev = true; L('stack','all').push(o); S.ms = S.ms.filter(z => z!==m); }
    else return;
    save(); refreshBehind(); return;
  }
  const src = L(sc, sk).find(z => z.id===sid); if (!src) return;
  if (sc==='stack'){ // applying something kept in 보관함
    if (dc!=='pc') return;
    const sub = dk || src.sub; if (!sub){ newHal(src.kind==='ms'?'ms':'todo', {text:src.text, date:dx.length===7?monthDue(dx):dx, src:'stack', id:src.id, cat:src.cat||null}); return; }
    const due = dx.length===7 ? monthDue(dx) : dx;
    if (src.kind==='ms'){ // a 루틴 needs 언제까지: the bar opens with its calendar, 취소 / 완료
      const r = t.getBoundingClientRect();
      st.qp = {t:`pc|${sub}|${dx}`, type:src.ev ? 'event' : 'todo', rep:true, cat:subById(sub).cat, sub, lock:true, dows:src.dows ? [...src.dows] : [0,2,4], x:r.left, y:r.top + 24, top:r.top, n:0,
        start:due, end:'', noEnd:false, cal:true, calYM:due.slice(0,7), apply:ref, text:src.text, star:!!src.star};
      drawQp(true); app.querySelector('#qin').value = src.text; return; }
    else { const o = {id:uid(), text:src.text, type:src.kind==='event' ? 'event' : 'todo', done:!!src.done}; setCS(o, subById(sub).cat, sub); if (src.star) o.star = true; L('days', due).push(o); }
    takeItem(ref); save(); refreshBehind(); return;
  }
  if (sc==='days' && (dc==='pc' || dc==='stack')){ // a plain 할일 to-do: another day, or back into 보관함
    takeItem(ref);
    if (dc==='stack'){ if (!src.sub) return; const o = {id:src.id, text:src.text, done:!!src.done, kind:src.type==='event' ? 'event' : 'todo'}; setCS(o, src.cat, src.sub); if (src.star) o.star = true; L('stack','all').push(o); }
    else { const o = {...src}, to = dx.length===7 ? sameDayIn(dx, sk) : dx; if (dk) setCS(o, subById(dk).cat, dk); if (o.end) o.end = isoAdd(o.end, Math.round((pIso(to) - pIso(sk)) / 864e5)); L('days', to).push(o); }
    save(); refreshBehind(); return;
  }
  if (dc!=='days' && dc!=='weeks') return;
  if (sc==='days' && dc==='weeks' && src.star){ takeItem(ref); L('days', isoAdd(dk, dowOf(pIso(sk)))).push(src); save(); refreshBehind(); return; } // a ★ dropped on another week keeps its weekday
  const hit = document.elementFromPoint(x, y)?.closest('.it[data-ref]')?.dataset.ref; let before = null;
  if (hit){ const [bc, bk, bi] = hit.split('|'); if (bc===dc && bk===dk) before = bi; }
  if (before===sid || (sc===dc && sk===dk && !before)) return;
  takeItem(ref);
  const o = {...src}; if (dc==='weeks'){ delete o.type; delete o.memo; delete o.end; } else if (sc==='weeks') o.type = 'todo';
  if (o.end && sc==='days' && dc==='days') o.end = isoAdd(o.end, Math.round((pIso(dk) - pIso(sk)) / 864e5));
  const dst = L(dc, dk), i = before ? dst.findIndex(z => z.id===before) : -1;
  if (i<0) dst.push(o); else dst.splice(i, 0, o);
  save(); refreshBehind();
}

/* ---------- tall screens: swipe months / years up-down, weeks sideways ---------- */
function stepPage(dir, axis){
  if (st.view==='day' && !st.hal){ // 일 = one day at a time
    let i = st.sel + dir; if (i>6){ shiftWeek(1); i = 0; } else if (i<0){ shiftWeek(-1); i = 6; }
    st.sel = i; st.dslide = dir>0 ? 'left' : 'right'; render(); return; }
  step(dir); st.slide = axis==='x' ? (dir>0 ? 'left' : 'right') : (dir>0 ? 'up' : 'down'); render();
}
let tStart = null;
document.addEventListener('touchstart', e => { if (st.ed || st.setOpen || st.qp || st.boxOpen) return; const t = e.touches[0]; tStart = {x:t.clientX, y:t.clientY, el:e.target}; }, {passive:true});
document.addEventListener('touchend', e => {
  if (!tStart) return; const t = e.changedTouches[0], dx = t.clientX - tStart.x, dy = t.clientY - tStart.y, el = tStart.el; tStart = null;
  if (drag || chipDrag?.on || Date.now() - noClick < 400 || Date.now() - (st.noClick || 0) < 400 || el.closest?.('input, .qbar, .hrow')) return;
  const vert = Math.abs(dy) > 50 && Math.abs(dy) > Math.abs(dx)*1.3, horiz = Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)*1.3;
  if (false && vert) return;
  if (!horiz || !el.closest?.('main')) return;
  for (let n = el; n && n.tagName!=='MAIN'; n = n.parentElement){ if (n.scrollWidth > n.clientWidth + 2 && /auto|scroll/.test(getComputedStyle(n).overflowX)) return; }   // a strip that scrolls sideways keeps its own swipe
  stepPage(dx<0 ? 1 : -1, 'x');
});
let wheelAcc = 0, wheelLock = 0;
addEventListener('wheel', e => {
  return;   // (the wheel scrolls; it no longer turns pages)
  e.preventDefault(); if (Date.now() < wheelLock) return;
  wheelAcc += e.deltaY; if (Math.abs(wheelAcc) > 80){ stepPage(wheelAcc>0 ? 1 : -1, 'y'); wheelAcc = 0; wheelLock = Date.now() + 450; }
}, {passive:false});

/* ---------- wide vs tall ---------- */
const isPortrait = () => innerWidth < 760 || innerWidth/innerHeight < 0.9;
addEventListener('resize', () => { const typing = document.activeElement?.tagName==='INPUT';
  if (typing && (st.ed || st.qp)) return;   // the phone keyboard shrinks the screen while typing — don't squash the page behind the sheet
  const p = isPortrait(); if (p!==st.portrait && !typing){ st.portrait = p; render(); } else layout(); });
st.portrait = isPortrait();
const h = location.hash.slice(1), hv = h.match(/(years|year|month|week|day)/);
if (hv) st.view = hv[1];
if (/hal/.test(h)) st.hal = true;
if (/goal/.test(h)) st.pm = 'goal';
// pieces made by an earlier "이번 주만 / 이번 달만" (a separate 반복 under the same 세부) go back inside their 반복
(function joinPieces(){ let moved = false;
  S.ms.slice().forEach(n => { if (!n.start || n.due===OPEN) return;
    const days = []; for (let k = n.start; k <= n.due; k = isoAdd(k, 1)) if (stepsOn(k).includes(n)) days.push(k);
    if (!days.length || days.length > 31) return;
    const o = S.ms.find(o => o!==n && o.sub===n.sub && msStart(o) <= n.start && o.due >= n.due && days.every(k => S.sskip?.[`${k}|${o.id}`] && o.dows.includes(dowOf(pIso(k)))));
    if (!o) return;
    days.forEach(k => { delete S.sskip[`${k}|${o.id}`]; const v = {}; if (n.text!==o.text) v.text = n.text; if (!!n.ev!==!!o.ev) v.ev = !!n.ev; if (Object.keys(v).length) (o.ov ||= {})[k] = v;
      if (S.sdone?.[`${k}|${n.id}`] || n.done){ if (o.done) delete S.sundone?.[`${k}|${o.id}`]; else S.sdone[`${k}|${o.id}`] = true; } delete S.sdone?.[`${k}|${n.id}`]; });
    S.ms = S.ms.filter(x => x!==n); moved = true; });
  if (moved) save(); })();
const hv2 = h.match(/ver([123])/); if (hv2) S.set.ver = +hv2[1];
const hh = h.match(/hv([123])/); if (hh) S.set.hv = +hh[1]; for (const k of ['hl','hy','hm']){ const mm = h.match(new RegExp(k+'([123])')); if (mm) S.set[k] = +mm[1]; }
render();
if (/opt$/.test(h)){ st.setOpen = true; render(); }
if (/edit$/.test(h)) newPlan(TODAY);
if (/msed$/.test(h)) newHal('ms');
})();
